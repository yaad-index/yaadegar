openapi: 3.1.0
info:
  title: Yaadegar API
  version: 0.1.0
  description: >
    Yaadegar is a self-hosted, API-first gift registry. This is the first-draft
    contract (see docs/adr/0002-api-design.md). Two surfaces share one API: an
    authenticated owner surface under /api/v1, and a mostly-anonymous giver
    surface under /public reached via a list's opaque share_slug. The tenant is
    resolved from the request Host header and is implicit in every path.

    A few owner-only file endpoints are served outside this generated contract
    because they are file downloads/uploads rather than JSON resources — notably
    GET /api/v1/lists/{listId}/export?format=json|csv (item-catalog export, #26).
    They run behind the same owner authentication; their identity-free file format
    (schema_version + columns) is documented in the README as a stability contract.
  license:
    name: MIT

servers:
  - url: https://{tenant}
    description: A tenant, addressed by its subdomain or custom domain (Host header).
    variables:
      tenant:
        default: example.wish.list

tags:
  - name: lists
    description: Owner-managed wishlists.
  - name: items
    description: Items within a list.
  - name: public
    description: Anonymous giver surface (view, reserve, co-buy) via share_slug.
  - name: domains
    description: Tenant subdomain and custom-domain management.
  - name: auth
    description: Owner authentication (login).
  - name: admin
    description: >
      Instance-level admin surface (not tenant-scoped), authorized by the
      instance-admin capability on an owner account (ADR-0010).
  - name: ops
    description: Operational endpoints.

paths:
  /healthz:
    get:
      operationId: getHealthz
      tags: [ops]
      summary: Liveness probe
      security: []
      responses:
        "200":
          description: Service is live.
          content:
            text/plain:
              schema: { type: string, example: "ok" }

  /api/v1/auth/login:
    post:
      operationId: login
      tags: [auth]
      summary: Log in with a username and password
      description: >
        Exchanges username+password credentials for a session access token (a
        signed JWT presented as a Bearer token on subsequent owner-surface
        requests). Unauthenticated; the tenant is resolved from the Host header.
        Available only when the password login method is enabled on the instance.
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/LoginRequest" }
      responses:
        "200":
          description: Authentication succeeded; a session access token is returned.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/LoginResponse" }
        "400": { $ref: "#/components/responses/BadRequest" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "429": { $ref: "#/components/responses/TooManyRequests" }
        "404":
          description: Password login is not enabled on this instance.
          content:
            application/problem+json:
              schema: { $ref: "#/components/schemas/Problem" }

  /api/v1/auth/methods:
    get:
      operationId: getAuthMethods
      tags: [auth]
      summary: Owner login methods available on this host
      description: >
        Reports which owner-login affordances the frontend should render for the
        tenant resolved from the Host. Unauthenticated. Owner login lives only on
        the main instance domain (a tenant's subdomain under the base domain); on a
        custom/CNAME domain — which is public-giver-only — both methods are false
        and login_url points at the tenant's canonical subdomain login page so the
        frontend can send an owner there.
      security: []
      responses:
        "200":
          description: The available login methods for this host.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/LoginMethods" }

  /admin/tenants:
    get:
      operationId: adminListTenants
      tags: [admin]
      summary: List all tenants (admin)
      parameters:
        - $ref: "#/components/parameters/Limit"
        - $ref: "#/components/parameters/Offset"
      responses:
        "200":
          description: A page of tenants.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/AdminTenantPage" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
    post:
      operationId: adminCreateTenant
      tags: [admin]
      summary: Create a tenant (admin)
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/AdminTenantCreate" }
      responses:
        "201":
          description: The created tenant.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Tenant" }
        "400": { $ref: "#/components/responses/BadRequest" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }
        "409": { $ref: "#/components/responses/Conflict" }

  /admin/owners:
    post:
      operationId: adminCreateOwner
      tags: [admin]
      summary: Create an owner with a password credential in a tenant (admin)
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/AdminOwnerCreate" }
      responses:
        "201":
          description: The created owner (never includes the password hash).
          content:
            application/json:
              schema: { $ref: "#/components/schemas/AdminOwner" }
        "400": { $ref: "#/components/responses/BadRequest" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }
        "409": { $ref: "#/components/responses/Conflict" }

  /admin/tenants/{tenantId}/users:
    parameters:
      - name: tenantId
        in: path
        required: true
        schema: { type: string }
    get:
      operationId: adminListUsers
      tags: [admin]
      summary: List a tenant's users (admin)
      parameters:
        - $ref: "#/components/parameters/Limit"
        - $ref: "#/components/parameters/Offset"
      responses:
        "200":
          description: A page of the tenant's users.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/AdminUserPage" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }
    post:
      operationId: adminCreateUser
      tags: [admin]
      summary: Create a user by email in a tenant (admin)
      description: >
        Provisions an owner or giver account for an email with no password; the
        user later sets credentials via an enabled login method (ADR-0009 Cut 1).
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/AdminUserCreate" }
      responses:
        "201":
          description: The created user (never includes any credential).
          content:
            application/json:
              schema: { $ref: "#/components/schemas/AdminUser" }
        "400": { $ref: "#/components/responses/BadRequest" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }
        "409": { $ref: "#/components/responses/Conflict" }

  /admin/tenants/{tenantId}/users/{userId}:
    parameters:
      - name: tenantId
        in: path
        required: true
        schema: { type: string }
      - name: userId
        in: path
        required: true
        schema: { type: string }
    patch:
      operationId: adminUpdateUser
      tags: [admin]
      summary: Change a user's role or ban state (admin)
      description: >
        Updates a user's role (owner ↔ giver) and/or ban flag (ADR-0009 Cut 1).
        Demotion to giver is REJECTED with 409 while the account still owns lists —
        owner access flows through list ownership, so the admin must reassign or
        delete those lists first; the error names the blocking count.
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/AdminUserUpdate" }
      responses:
        "200":
          description: The updated user.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/AdminUser" }
        "400": { $ref: "#/components/responses/BadRequest" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }
        "409":
          description: >
            Demotion blocked: the account still owns lists. The detail names how
            many; reassign or delete them before demoting.
          content:
            application/problem+json:
              schema: { $ref: "#/components/schemas/Problem" }

  /api/v1/me:
    get:
      operationId: getCurrentUser
      tags: [lists]
      summary: Get the current owner/tenant
      responses:
        "200":
          description: The authenticated user and their tenant.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/User" }
        "401": { $ref: "#/components/responses/Unauthorized" }

  /api/v1/settings:
    get:
      operationId: getTenantSettings
      tags: [lists]
      summary: Get the owner's tenant settings
      description: >
        The tenant-level settings the owner controls (ADR-0008). Includes the
        Google-login toggle and, read-only, whether the instance has a Google
        client configured — the toggle is inert without one.
      responses:
        "200":
          description: The tenant settings.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/TenantSettings" }
        "401": { $ref: "#/components/responses/Unauthorized" }
    patch:
      operationId: updateTenantSettings
      tags: [lists]
      summary: Update the owner's tenant settings
      description: >
        Updates the tenant-level settings. The change applies only to the
        authenticated owner's own tenant (resolved from the session), never a
        tenant named in the request.
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/TenantSettingsUpdate" }
      responses:
        "200":
          description: The updated tenant settings.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/TenantSettings" }
        "400": { $ref: "#/components/responses/BadRequest" }
        "401": { $ref: "#/components/responses/Unauthorized" }

  /api/v1/lists:
    get:
      operationId: listLists
      tags: [lists]
      summary: List the owner's lists
      parameters:
        - $ref: "#/components/parameters/Limit"
        - $ref: "#/components/parameters/Offset"
      responses:
        "200":
          description: A page of the owner's lists.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ListPage" }
        "401": { $ref: "#/components/responses/Unauthorized" }
    post:
      operationId: createList
      tags: [lists]
      summary: Create a list
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/ListCreate" }
      responses:
        "201":
          description: The created list.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/List" }
        "400": { $ref: "#/components/responses/BadRequest" }
        "401": { $ref: "#/components/responses/Unauthorized" }

  /api/v1/lists/{listId}:
    parameters:
      - $ref: "#/components/parameters/ListId"
    get:
      operationId: getList
      tags: [lists]
      summary: Get a list (owner view)
      responses:
        "200":
          description: The list, owner view (includes reservation availability).
          content:
            application/json:
              schema: { $ref: "#/components/schemas/List" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }
    patch:
      operationId: updateList
      tags: [lists]
      summary: Update a list
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/ListUpdate" }
      responses:
        "200":
          description: The updated list.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/List" }
        "400": { $ref: "#/components/responses/BadRequest" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }
    delete:
      operationId: deleteList
      tags: [lists]
      summary: Delete a list
      responses:
        "204": { description: Deleted. }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }

  /api/v1/lists/{listId}/items:
    parameters:
      - $ref: "#/components/parameters/ListId"
    get:
      operationId: listItems
      tags: [items]
      summary: List items in a list
      parameters:
        - $ref: "#/components/parameters/Limit"
        - $ref: "#/components/parameters/Offset"
      responses:
        "200":
          description: A page of items.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ItemPage" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }
    post:
      operationId: createItem
      tags: [items]
      summary: Add an item
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/ItemCreate" }
      responses:
        "201":
          description: The created item.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Item" }
        "400": { $ref: "#/components/responses/BadRequest" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }

  /api/v1/items/{itemId}:
    parameters:
      - $ref: "#/components/parameters/ItemId"
    patch:
      operationId: updateItem
      tags: [items]
      summary: Update an item
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/ItemUpdate" }
      responses:
        "200":
          description: The updated item.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Item" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }
    delete:
      operationId: deleteItem
      tags: [items]
      summary: Delete an item
      responses:
        "204": { description: Deleted. }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }

  /api/v1/item-previews:
    post:
      operationId: previewItem
      tags: [items]
      summary: Fetch item metadata from a product URL (browser auto-add)
      description: >
        Server-side scrape of a product page (OpenGraph / Twitter cards / JSON-LD)
        returning a draft item the client can review before creating. Never
        creates an item itself; the client POSTs the confirmed draft to /items.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [url]
              properties:
                url: { type: string, format: uri }
      responses:
        "200":
          description: Best-effort scraped draft. Fields may be null if not found.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ItemDraft" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "422":
          description: The URL could not be fetched or parsed; fall back to manual entry.
          content:
            application/problem+json:
              schema: { $ref: "#/components/schemas/Problem" }

  /api/v1/domains:
    get:
      operationId: listDomains
      tags: [domains]
      summary: List the tenant's custom domains
      responses:
        "200":
          description: The tenant's domains and their verification/TLS status.
          content:
            application/json:
              schema:
                type: array
                items: { $ref: "#/components/schemas/Domain" }
        "401": { $ref: "#/components/responses/Unauthorized" }
    post:
      operationId: addDomain
      tags: [domains]
      summary: Add a custom domain (bring-your-own-domain)
      description: >
        Registers a custom hostname for the tenant and returns the CNAME target
        to point it at. TLS is provisioned on-demand once the CNAME verifies
        (deferred feature; see ADR-0001).
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [hostname]
              properties:
                hostname: { type: string, example: gifts.example.com }
      responses:
        "201":
          description: >
            The registered (unverified) domain, including the verification_token
            to publish as a DNS TXT record at _yaadegar-verify.<hostname>.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Domain" }
        "400": { $ref: "#/components/responses/BadRequest" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "409": { $ref: "#/components/responses/Conflict" }

  /api/v1/domains/{domainId}:
    parameters:
      - name: domainId
        in: path
        required: true
        schema: { type: string }
    delete:
      operationId: deleteDomain
      tags: [domains]
      summary: Remove a custom domain
      responses:
        "204": { description: Removed. }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "404": { $ref: "#/components/responses/NotFound" }

  /api/v1/domains/{domainId}/verify:
    parameters:
      - name: domainId
        in: path
        required: true
        schema: { type: string }
    post:
      operationId: verifyDomain
      tags: [domains]
      summary: Check the domain's DNS TXT verification record
      description: >
        Looks up the DNS TXT record at _yaadegar-verify.<hostname> and marks the
        domain verified if it contains the verification_token. Idempotent: an
        already-verified domain returns verified; a missing or non-matching record
        returns the domain still unverified (retry after publishing the record) —
        not an error. Only verified domains route requests to the tenant.
      responses:
        "200":
          description: The domain with its (possibly now-updated) verified state.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Domain" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "404": { $ref: "#/components/responses/NotFound" }

  /public/{shareSlug}:
    parameters:
      - $ref: "#/components/parameters/ShareSlug"
    get:
      operationId: getPublicList
      tags: [public]
      summary: View a shared list (anonymous)
      security: []
      description: >
        Public read view of a list by its share_slug. Shows items and each item's
        availability (available / reserved / being co-bought) but never who
        reserved or is buying. Disabled lists (past event_date, or inactive)
        return 410.
      responses:
        "200":
          description: The public list view.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/PublicList" }
        "404": { $ref: "#/components/responses/NotFound" }
        "410":
          description: The list is no longer active (past its event date or disabled).
          content:
            application/problem+json:
              schema: { $ref: "#/components/schemas/Problem" }

  /public/{shareSlug}/items/{itemId}/reservations:
    parameters:
      - $ref: "#/components/parameters/ShareSlug"
      - $ref: "#/components/parameters/ItemId"
    post:
      operationId: createReservation
      tags: [public]
      summary: Reserve an item (anonymous giver)
      security: []
      description: >
        Claims an item so nobody duplicates the gift. Optional name/email are used
        only server-side (e.g. decay reminders) and are never shown to others.

        On a full_guest list the reservation is active immediately and a one-time
        capability token is returned (201). On an email_confirmed list the
        reservation is held provisionally as pending_confirmation and a
        confirmation link is emailed; the response is 202 with status
        pending_confirmation and no token — the giver must confirm (see
        /public/reservations/confirm) before the reservation activates and the
        token is issued. An email_confirmed reserve requires giver_email.
      requestBody:
        content:
          application/json:
            schema: { $ref: "#/components/schemas/ReservationCreate" }
      responses:
        "201":
          description: Reservation active; capability token returned once (full_guest).
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ReservationCreated" }
        "202":
          description: >
            Reservation held pending email confirmation (email_confirmed); a
            confirmation link was emailed. No token until confirmed.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ReservationCreated" }
        "400": { $ref: "#/components/responses/BadRequest" }
        "404": { $ref: "#/components/responses/NotFound" }
        "409":
          description: The item is already fully reserved.
          content:
            application/problem+json:
              schema: { $ref: "#/components/schemas/Problem" }
        "410":
          description: The list is no longer active (past its event date or disabled).
          content:
            application/problem+json:
              schema: { $ref: "#/components/schemas/Problem" }
        "503":
          description: >
            An email_confirmed reservation could not send its confirmation email;
            the provisional hold was rolled back and the slot freed. Transient —
            retry the reservation.
          content:
            application/problem+json:
              schema: { $ref: "#/components/schemas/Problem" }

  /public/reservations/{reservationId}:
    parameters:
      - name: reservationId
        in: path
        required: true
        schema: { type: string }
    delete:
      operationId: releaseReservation
      tags: [public]
      summary: Release a reservation (anonymous giver)
      description: Requires the capability token returned at creation.
      security:
        - capabilityToken: []
      responses:
        "204": { description: Released. }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "404": { $ref: "#/components/responses/NotFound" }

  /public/reservations/confirm:
    post:
      operationId: confirmReservation
      tags: [public]
      summary: Confirm an email_confirmed reservation via its emailed token (anonymous)
      security: []
      description: >
        Activates the pending_confirmation reservation identified by the one-time
        token emailed to the giver at reserve time, and returns the capability
        token to release it later. Idempotent: re-confirming an already-active
        reservation returns 200 with status active and no new capability token
        (it cannot be re-issued). The token stops working once the confirm window
        elapses and the reservation auto-expires.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [token]
              properties:
                token: { type: string }
      responses:
        "200":
          description: Reservation active. Capability token present on first confirm.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ReservationConfirmed" }
        "404": { $ref: "#/components/responses/NotFound" }
        "410":
          description: The confirm window elapsed; the reservation expired and the link is spent.
          content:
            application/problem+json:
              schema: { $ref: "#/components/schemas/Problem" }

  /public/decay-release:
    post:
      operationId: releaseByDecayToken
      tags: [public]
      summary: Release a stale reservation via its one-click decay token (anonymous)
      security: []
      description: >
        Releases the reservation identified by a one-click decay-release token,
        emailed to the reserver when their reservation goes stale. Single-use: the
        token stops working once the reservation is released or auto-expires.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [token]
              properties:
                token: { type: string }
      responses:
        "204": { description: Released. }
        "404": { $ref: "#/components/responses/NotFound" }
        "410":
          description: The reservation already expired; the link is no longer valid.
          content:
            application/problem+json:
              schema: { $ref: "#/components/schemas/Problem" }

  /public/decay-keep:
    post:
      operationId: keepByDecayToken
      tags: [public]
      summary: Renew a stale reservation via its one-click decay token (anonymous)
      security: []
      description: >
        Renews (keeps) the reservation identified by a one-click decay-keep token,
        emailed to the reserver alongside the release link. Resets the decay clock
        and invalidates both one-click tokens. Single-use: the token stops working
        once used or once the reservation auto-expires.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [token]
              properties:
                token: { type: string }
      responses:
        "204": { description: Renewed. }
        "404": { $ref: "#/components/responses/NotFound" }
        "410":
          description: The reservation already expired; the link is no longer valid.
          content:
            application/problem+json:
              schema: { $ref: "#/components/schemas/Problem" }

  /public/{shareSlug}/items/{itemId}/contributions:
    parameters:
      - $ref: "#/components/parameters/ShareSlug"
      - $ref: "#/components/parameters/ItemId"
    post:
      operationId: createContribution
      tags: [public]
      summary: Pledge a share toward co-buying an item
      security: []
      description: >
        Opt-in group gifting. The giver pledges a share of the price and provides
        a contact that is revealed ONLY if a two-sided match forms and both
        parties confirm. Returns a capability token to poll/confirm/withdraw later.
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/ContributionCreate" }
      responses:
        "201":
          description: Contribution recorded; token returned once. May include a proposed match.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ContributionCreated" }
        "400": { $ref: "#/components/responses/BadRequest" }
        "403":
          description: Co-buying is turned off for this item by the owner (#100).
          content:
            application/problem+json:
              schema: { $ref: "#/components/schemas/Problem" }
        "404": { $ref: "#/components/responses/NotFound" }
        "409":
          description: The item is already fully funded or reserved.
          content:
            application/problem+json:
              schema: { $ref: "#/components/schemas/Problem" }
        "410":
          description: The list is no longer active (past its event date or disabled).
          content:
            application/problem+json:
              schema: { $ref: "#/components/schemas/Problem" }

  /public/contributions/{contributionId}:
    parameters:
      - name: contributionId
        in: path
        required: true
        schema: { type: string }
    get:
      operationId: getContribution
      tags: [public]
      summary: Get a contribution and any pending match (anonymous giver)
      description: >
        Lets a contributor discover a match proposed after their pledge — the
        server also emails them a link out-of-band, but this endpoint is the
        pollable path so EITHER party (including the first pledger) can find the
        match_id to confirm. Requires the capability token.
      security:
        - capabilityToken: []
      responses:
        "200":
          description: The contribution, including match_id when a match is pending.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Contribution" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "404": { $ref: "#/components/responses/NotFound" }
    delete:
      operationId: withdrawContribution
      tags: [public]
      summary: Withdraw a contribution (anonymous giver)
      description: >
        Withdraw a pledge before a match is confirmed. Requires the capability
        token. Once a match is both_confirmed, withdrawal is no longer allowed (409).
      security:
        - capabilityToken: []
      responses:
        "204": { description: Withdrawn. }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "404": { $ref: "#/components/responses/NotFound" }
        "409": { $ref: "#/components/responses/Conflict" }

  /public/matches/{matchId}:
    parameters:
      - name: matchId
        in: path
        required: true
        schema: { type: string }
    get:
      operationId: getMatch
      tags: [public]
      summary: Read a co-buying match's state (anonymous giver)
      description: >
        Returns a match's proposed/confirmed state so a contributor can load the
        confirm/decline handshake — including cross-device from the emailed link.
        Authorized by X-Capability-Token carrying EITHER the contributor's
        capability token (same-browser) or the scoped match-action token
        (cross-device); the token must belong to this match. Contacts are revealed
        only once the match is both_confirmed (ADR-0002 §6).
      security:
        - capabilityToken: []
      responses:
        "200":
          description: The match state; contacts present only when both_confirmed.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Match" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "404": { $ref: "#/components/responses/NotFound" }
        "410":
          description: The scoped match-action token has expired.
          content:
            application/problem+json:
              schema: { $ref: "#/components/schemas/Problem" }

  /public/matches/{matchId}/confirm:
    parameters:
      - name: matchId
        in: path
        required: true
        schema: { type: string }
    post:
      operationId: confirmMatch
      tags: [public]
      summary: Confirm or decline a proposed co-buying match
      description: >
        Each matched contributor confirms via their capability token. Contacts are
        revealed to each other only after BOTH confirm; a decline dissolves the match.
      security:
        - capabilityToken: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [decision]
              properties:
                decision: { type: string, enum: [confirm, decline] }
      responses:
        "200":
          description: The updated match state.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Match" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "404": { $ref: "#/components/responses/NotFound" }
        "409":
          description: The match is already resolved (both-confirmed or declined).
          content:
            application/problem+json:
              schema: { $ref: "#/components/schemas/Problem" }

components:
  securitySchemes:
    ownerBearer:
      type: http
      scheme: bearer
      description: Owner-surface bearer token.
    capabilityToken:
      type: apiKey
      in: header
      name: X-Capability-Token
      description: >
        One-time capability token returned when a giver's object (reservation or
        contribution) was created. Scopes the caller to that object only.

  parameters:
    ListId:
      name: listId
      in: path
      required: true
      schema: { type: string }
    ItemId:
      name: itemId
      in: path
      required: true
      schema: { type: string }
    ShareSlug:
      name: shareSlug
      in: path
      required: true
      schema: { type: string }
      description: A list's opaque, unguessable share slug.
    Limit:
      name: limit
      in: query
      schema: { type: integer, minimum: 1, maximum: 200, default: 50 }
    Offset:
      name: offset
      in: query
      schema: { type: integer, minimum: 0, default: 0 }

  responses:
    Unauthorized:
      description: Missing or invalid credentials.
      content:
        application/problem+json:
          schema: { $ref: "#/components/schemas/Problem" }
    Forbidden:
      description: Authenticated, but not permitted to act on this resource.
      content:
        application/problem+json:
          schema: { $ref: "#/components/schemas/Problem" }
    BadRequest:
      description: The request body failed validation.
      content:
        application/problem+json:
          schema: { $ref: "#/components/schemas/Problem" }
    NotFound:
      description: The resource does not exist (or is not visible to the caller).
      content:
        application/problem+json:
          schema: { $ref: "#/components/schemas/Problem" }
    Conflict:
      description: The request conflicts with current state.
      content:
        application/problem+json:
          schema: { $ref: "#/components/schemas/Problem" }
    TooManyRequests:
      description: Too many failed attempts; the caller is temporarily rate-limited.
      content:
        application/problem+json:
          schema: { $ref: "#/components/schemas/Problem" }

  schemas:
    Problem:
      type: object
      description: RFC 9457 problem detail.
      properties:
        type: { type: string, default: "about:blank" }
        title: { type: string }
        status: { type: integer }
        detail: { type: string }

    Money:
      type: object
      description: An exact monetary amount as minor units plus ISO-4217 currency.
      required: [amount_minor, currency]
      properties:
        amount_minor: { type: integer, description: "Amount in minor units (e.g. cents)." }
        currency: { type: string, minLength: 3, maxLength: 3, example: EUR }

    User:
      type: object
      properties:
        id: { type: string }
        name: { type: string }
        is_admin:
          type: boolean
          description: >
            Whether this account holds the instance-admin capability (ADR-0010).
            The frontend uses it to reveal the admin surface; every /admin call is
            still authorized server-side.
        tenant:
          type: object
          properties:
            id: { type: string }
            subdomain: { type: string, example: alice }

    Tenant:
      type: object
      properties:
        id: { type: string }
        subdomain: { type: string }

    AdminTenantCreate:
      type: object
      required: [subdomain]
      properties:
        subdomain: { type: string, minLength: 1, description: "Lowercase slug; the tenant is addressed at <subdomain>.<base-domain>." }

    AdminOwner:
      type: object
      properties:
        id: { type: string }
        tenant_id: { type: string }
        email: { type: string }

    AdminOwnerCreate:
      type: object
      required: [tenant_id, email, password]
      properties:
        tenant_id: { type: string, minLength: 1 }
        email: { type: string, minLength: 1 }
        password: { type: string, minLength: 1, description: "Plaintext; hashed server-side (argon2id). The email doubles as the login username." }

    AdminTenant:
      type: object
      required: [id, subdomain]
      properties:
        id: { type: string }
        subdomain: { type: string }

    AdminTenantPage:
      type: object
      required: [items, total]
      properties:
        items:
          type: array
          items: { $ref: "#/components/schemas/AdminTenant" }
        total: { type: integer, description: "Total tenants, ignoring pagination." }

    AdminUserRole:
      type: string
      enum: [owner, giver]
      description: "Per-tenant role (ADR-0009). The instance-admin capability is separate."

    AdminUser:
      type: object
      required: [id, tenant_id, email, role, banned]
      properties:
        id: { type: string }
        tenant_id: { type: string }
        email: { type: string }
        name: { type: string }
        role: { $ref: "#/components/schemas/AdminUserRole" }
        banned: { type: boolean }

    AdminUserPage:
      type: object
      required: [items, total]
      properties:
        items:
          type: array
          items: { $ref: "#/components/schemas/AdminUser" }
        total: { type: integer, description: "Total users in the tenant, ignoring pagination." }

    AdminUserCreate:
      type: object
      required: [email, role]
      properties:
        email: { type: string, minLength: 1, description: "The email doubles as the login username." }
        role: { $ref: "#/components/schemas/AdminUserRole" }
        name: { type: string, description: "Display name; defaults to the email." }

    AdminUserUpdate:
      type: object
      description: "At least one field; omitted fields are left unchanged."
      properties:
        role: { $ref: "#/components/schemas/AdminUserRole" }
        banned: { type: boolean }

    LoginRequest:
      type: object
      required: [username, password]
      properties:
        username: { type: string, minLength: 1 }
        password: { type: string, minLength: 1 }

    LoginResponse:
      type: object
      required: [access_token, token_type, expires_in]
      properties:
        access_token:
          type: string
          description: "Signed JWT to present as `Authorization: Bearer <token>`."
        token_type: { type: string, enum: [Bearer], example: Bearer }
        expires_in:
          type: integer
          description: Access-token lifetime in seconds.

    TenantSettings:
      type: object
      required: [oauth_google_enabled, google_client_configured]
      properties:
        oauth_google_enabled:
          type: boolean
          description: Whether Google login is turned on for this tenant.
        google_client_configured:
          type: boolean
          description: >
            Read-only. Whether the instance has a Google OAuth client configured.
            When false, the tenant toggle has no effect (the method is
            unavailable) — the UI can use this to explain why.

    TenantSettingsUpdate:
      type: object
      required: [oauth_google_enabled]
      properties:
        oauth_google_enabled:
          type: boolean
          description: Turn Google login on or off for this tenant.

    LoginMethods:
      type: object
      required: [password, google, login_url]
      properties:
        password:
          type: boolean
          description: >
            Whether to render the username+password form on this host (the
            instance has password login enabled AND this is not a custom domain).
        google:
          type: boolean
          description: >
            Whether to render the "Sign in with Google" button on this host (a
            Google client is configured, the tenant toggle is on, AND this is not a
            custom domain).
        login_url:
          type: string
          description: >
            The tenant's canonical owner-login URL (its subdomain under the base
            domain). On a custom domain — where both methods are false — the
            frontend redirects owners here. Empty when the base domain is unset.

    # Three-state nullable wrappers for PATCH override fields (#111): they map to
    # oapi-codegen/nullable.Nullable[T], which distinguishes an absent field (leave
    # as-is) from an explicit null (clear back to inherit / no value) from a value
    # (set). Used only on the *Update request bodies where clear-semantics matter.
    NullableBool:
      type: [boolean, "null"]
      x-go-type: nullable.Nullable[bool]
      x-go-type-skip-optional-pointer: true
      x-go-type-import:
        path: github.com/oapi-codegen/nullable
    NullableInt:
      type: [integer, "null"]
      x-go-type: nullable.Nullable[int]
      x-go-type-skip-optional-pointer: true
      x-go-type-import:
        path: github.com/oapi-codegen/nullable
    NullableString:
      type: [string, "null"]
      x-go-type: nullable.Nullable[string]
      x-go-type-skip-optional-pointer: true
      x-go-type-import:
        path: github.com/oapi-codegen/nullable
    NullableDate:
      type: [string, "null"]
      format: date
      x-go-type: nullable.Nullable[openapi_types.Date]
      x-go-type-skip-optional-pointer: true
      x-go-type-import:
        path: github.com/oapi-codegen/nullable

    ListVisibility:
      type: string
      enum: [public, unlisted, private]

    ListCreate:
      type: object
      required: [title]
      properties:
        title: { type: string }
        visibility: { $ref: "#/components/schemas/ListVisibility" }
        event_date:
          type: [string, "null"]
          format: date
          description: Optional. After this date the list auto-disables (read-only).
        decay_days:
          type: [integer, "null"]
          minimum: 0
          description: >
            Reservation-decay period override. Omit (or null) to inherit the
            instance default; 0 means off (this list never decays); N means a
            reservation may sit N days before the reserver is asked to keep or
            release it.
        reserver_tier:
          type: [string, "null"]
          description: >
            Reserver-identity tier override (ADR-0007): full_guest | email_confirmed |
            registered. Omit (or null) to inherit the instance default. full_guest
            reserves with a one-time capability token; email_confirmed requires the
            giver to confirm an email before the reservation activates; registered
            (deferred) requires a giver account.
        reserver_confirm_window:
          type: [integer, "null"]
          minimum: 0
          description: >
            email_confirmed confirm-window override in minutes (ADR-0007). Omit (or
            null) to inherit the instance default; 0 means an unconfirmed hold never
            auto-expires; N means it expires N minutes after reserve if unconfirmed.

    ListUpdate:
      type: object
      # The override fields below are three-state (#111): absent leaves the value,
      # null clears it (to inherit the instance default, or no event date), a value
      # sets it. See the Nullable* wrapper schemas.
      properties:
        title: { type: string }
        visibility: { $ref: "#/components/schemas/ListVisibility" }
        event_date: { $ref: "#/components/schemas/NullableDate" }
        decay_days: { $ref: "#/components/schemas/NullableInt" }
        active: { type: boolean }
        reserver_tier: { $ref: "#/components/schemas/NullableString" }
        reserver_confirm_window: { $ref: "#/components/schemas/NullableInt" }
        allow_cobuy:
          type: boolean
          description: >
            List-level default for whether items may be co-bought (#100). Items
            inherit this unless they set their own override. Defaults to true; a new
            list is always created co-buy-enabled and is toggled here.
        thank_you_template:
          type: string
          description: >
            List-level default owner→giver thank-you note body (#22), emailed to a
            reserver when their reservation goes active. "" disables it. A `{item}`
            token is replaced with the item name; the note carries no giver identity.

    List:
      type: object
      properties:
        id: { type: string }
        title: { type: string }
        visibility: { $ref: "#/components/schemas/ListVisibility" }
        share_slug: { type: string }
        event_date: { type: [string, "null"], format: date }
        decay_days:
          type: [integer, "null"]
          description: The decay-period override; null means inheriting the instance default.
        reserver_tier:
          type: [string, "null"]
          description: The reserver-identity tier override; null inherits the instance default.
        reserver_confirm_window:
          type: [integer, "null"]
          description: The confirm-window override in minutes; null inherits the instance default.
        allow_cobuy:
          type: boolean
          description: The list-level default for whether items may be co-bought (#100).
        thank_you_template:
          type: string
          description: The list-level default thank-you note body (#22); "" = no note.
        active: { type: boolean }
        item_count: { type: integer }
        created_at: { type: string, format: date-time }

    ListPage:
      type: object
      properties:
        items:
          type: array
          items: { $ref: "#/components/schemas/List" }
        total: { type: integer }
        limit: { type: integer }
        offset: { type: integer }

    ItemAvailability:
      type: string
      enum: [available, reserved, co_buying, purchased]
      description: Availability only. Never reveals who reserved or is buying.

    ItemDraft:
      type: object
      description: Scraped/proposed item fields (any may be null).
      properties:
        name: { type: [string, "null"] }
        url: { type: [string, "null"], format: uri }
        image_url: { type: [string, "null"], format: uri }
        price: { $ref: "#/components/schemas/Money" }

    ItemCreate:
      type: object
      required: [name]
      properties:
        name: { type: string }
        url: { type: [string, "null"], format: uri }
        image_url: { type: [string, "null"], format: uri }
        price: { $ref: "#/components/schemas/Money" }
        note: { type: [string, "null"] }
        priority: { type: integer, minimum: 0, default: 0 }
        quantity_wanted: { type: integer, minimum: 1, default: 1 }
        allow_cobuy:
          type: [boolean, "null"]
          description: >
            Per-item co-buy override (#100): omit (or null) to inherit the list
            default, true/false to force co-buying on/off for this item.
        thank_you_template:
          type: [string, "null"]
          description: >
            Per-item thank-you override (#22): omit (or null) to inherit the list
            default, "" to suppress the note for this item, any other value to
            override the body.

    ItemUpdate:
      type: object
      properties:
        name: { type: string }
        url: { type: [string, "null"], format: uri }
        image_url: { type: [string, "null"], format: uri }
        price: { $ref: "#/components/schemas/Money" }
        note: { type: [string, "null"] }
        priority: { type: integer, minimum: 0 }
        quantity_wanted: { type: integer, minimum: 1 }
        # Per-item co-buy override (#100): true/false sets it, null clears back to
        # inheriting the list default, absent leaves it unchanged (#111).
        allow_cobuy: { $ref: "#/components/schemas/NullableBool" }
        # Per-item thank-you override (#22): a value (incl. "") sets it, null clears
        # back to inheriting the list default, absent leaves it unchanged (#111).
        thank_you_template: { $ref: "#/components/schemas/NullableString" }

    Item:
      type: object
      properties:
        id: { type: string }
        list_id: { type: string }
        name: { type: string }
        url: { type: [string, "null"], format: uri }
        image_url: { type: [string, "null"], format: uri }
        price: { $ref: "#/components/schemas/Money" }
        note: { type: [string, "null"] }
        priority: { type: integer }
        quantity_wanted: { type: integer }
        availability: { $ref: "#/components/schemas/ItemAvailability" }
        reserved_quantity:
          type: integer
          description: >
            How many units are reserved (owner view). This is a count only and
            never identifies who reserved them (ADR-0002 §5).
        allow_cobuy:
          type: [boolean, "null"]
          description: >
            The per-item co-buy override (#100), owner view: null means inheriting
            the list default, true/false an explicit override.
        thank_you_template:
          type: [string, "null"]
          description: >
            The per-item thank-you override (#22), owner view: null inherits the list
            default, "" is a per-item opt-out, any other value overrides the body.

    ItemPage:
      type: object
      properties:
        items:
          type: array
          items: { $ref: "#/components/schemas/Item" }
        total: { type: integer }
        limit: { type: integer }
        offset: { type: integer }

    PublicItem:
      type: object
      description: An item as a giver sees it — availability only, no reserver identity.
      properties:
        id: { type: string }
        name: { type: string }
        url: { type: [string, "null"], format: uri }
        image_url: { type: [string, "null"], format: uri }
        price: { $ref: "#/components/schemas/Money" }
        note: { type: [string, "null"] }
        availability: { $ref: "#/components/schemas/ItemAvailability" }
        amount_funded: { $ref: "#/components/schemas/Money" }
        allow_cobuy:
          type: boolean
          description: >
            Whether this item may be co-bought (#100, resolved from the item override
            and list default). The giver UI shows the chip-in affordance only when
            this is true AND the item is priced.

    PublicList:
      type: object
      properties:
        title: { type: string }
        event_date: { type: [string, "null"], format: date }
        items:
          type: array
          items: { $ref: "#/components/schemas/PublicItem" }

    ReservationCreate:
      type: object
      properties:
        giver_name: { type: [string, "null"] }
        giver_email: { type: [string, "null"], format: email }
        quantity: { type: integer, minimum: 1, default: 1 }

    ReservationCreated:
      type: object
      required: [reservation_id, status]
      properties:
        reservation_id: { type: string }
        status:
          type: string
          enum: [active, pending_confirmation]
          description: >
            active — the reservation holds the item now (full_guest tier).
            pending_confirmation — an email_confirmed reservation holding the item
            provisionally until the giver confirms via the emailed link; no
            capability token is issued until then.
        capability_token:
          type: string
          description: >
            The release handle, returned once. Present only for an active
            reservation; absent while pending_confirmation (issued at confirm).

    ReservationConfirmed:
      type: object
      required: [reservation_id, status]
      properties:
        reservation_id: { type: string }
        status:
          type: string
          enum: [active]
          description: >
            Always active on a 200 — the reservation now holds the item, whether
            this request activated it or it was already confirmed.
        capability_token:
          type: string
          description: >
            Returned once, on the confirming request that activates the
            reservation. Absent on an idempotent re-confirm of an
            already-active reservation (it cannot be re-issued).

    ContributionStatus:
      type: string
      description: >
        tracks a pledge through the co-buying handshake. The terminal statuses
        (declined, withdrawn, expired) free the item; expired is set by the match
        auto-expiry sweep when a proposed match's confirm window elapses.
      enum: [pending, matched, confirmed, declined, withdrawn, expired]

    ContributionCreate:
      type: object
      required: [pledged, contact_email]
      properties:
        pledged:
          allOf:
            - $ref: "#/components/schemas/Money"
          description: The share this giver pledges toward the item's price.
        giver_name: { type: [string, "null"] }
        contact_email:
          type: string
          format: email
          description: Revealed to a co-buyer only after a mutually-confirmed match.

    Contribution:
      type: object
      description: A giver's pledge toward co-buying an item (giver-facing view).
      properties:
        id: { type: string }
        item_id: { type: string }
        pledged: { $ref: "#/components/schemas/Money" }
        status: { $ref: "#/components/schemas/ContributionStatus" }
        match_id:
          type: [string, "null"]
          description: Set when a match involving this contribution is pending; POST it to confirm.

    ContributionCreated:
      type: object
      properties:
        contribution_id: { type: string }
        capability_token: { type: string, description: "Returned once." }
        match:
          oneOf:
            - { $ref: "#/components/schemas/Match" }
            - { type: "null" }
          description: A proposed match if this pledge completed funding; else null.

    MatchState:
      type: string
      description: >
        is the lifecycle state of a co-buying match. The terminal `expired` is set
        by the match auto-expiry sweep when a proposed match sits past its confirm
        window; its pledges are released.
      enum: [proposed, both_confirmed, done, declined, expired]

    Match:
      type: object
      description: A co-buying handshake between contributions on one item.
      properties:
        id: { type: string }
        item_id: { type: string }
        state: { $ref: "#/components/schemas/MatchState" }
        contribution_ids:
          type: array
          items: { type: string }
        contacts:
          type: array
          description: Populated only once state is both_confirmed.
          items: { type: string, format: email }

    Domain:
      type: object
      properties:
        id: { type: string }
        hostname: { type: string }
        cname_target: { type: string, description: "Point your CNAME here." }
        verified: { type: boolean }
        tls_status: { type: string, enum: [none, pending, active] }
        verification_token:
          type: string
          description: >
            Publish this as a DNS TXT record at _yaadegar-verify.<hostname>, then
            call verify. A proof-of-control challenge, not a secret.

security:
  - ownerBearer: []
