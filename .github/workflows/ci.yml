name: CI

# Runs on the merge candidate AND on the trunk itself (#356). The pull_request run
# tests a commit that ceases to exist at merge: a squash produces a new SHA that no
# run has covered, so `main` — the thing images are published from — had no suite
# run of its own. The push trigger closes that: every commit on main gets a run
# keyed to its own SHA.
#
# That run is also the evidence docker-publish.yml consumes. Its gate looks up the
# ci.yml run for the exact SHA it is about to build and refuses to publish without a
# green one, so removing this trigger does not merely stop reporting on main — it
# blocks publishing. The two are one mechanism, not a check plus a nicety.
on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Go
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          # Track the version pinned in go.mod so CI and the module stay in
          # lockstep — single source of truth.
          go-version-file: go.mod

      - name: Build
        run: go build ./...

      # Regenerate from api/openapi.yaml (oapi-codegen pinned in go.mod) and fail
      # if the checked-in generated code drifts from the spec — they must match.
      - name: Verify generated code is in sync with the spec
        run: make verify-generate

      # The workflow shell that guards releases and publishes lives in
      # .github/scripts so it can be exercised (#359, #343). These run here rather
      # than in a job of their own because `check` is already a required context: a
      # new job would not gate anything until branch protection was edited, and a
      # test that runs green beside a regression is the state those issues exist to
      # end.
      - name: Test the workflow scripts against stubs
        run: |
          set -euo pipefail
          for t in .github/scripts/*.test.sh; do
            echo "--- $t"
            bash "$t"
          done

      - name: Vet
        run: go vet ./...

      - name: Gofmt
        run: |
          unformatted="$(gofmt -l .)"
          if [ -n "$unformatted" ]; then
            echo "These files are not gofmt-formatted:"
            echo "$unformatted"
            exit 1
          fi

      - name: Lint
        uses: golangci/golangci-lint-action@ba0d7d2ec06a0ea1cb5fa41b2e4a3ab91d21278a # v9.3.0
        with:
          # Pin the linter version so CI matches the local run (same reasoning as
          # go-version-file above); Dependabot bumps it deliberately.
          version: v2.11.4

      - name: Test
        run: go test -race ./...

  # The Postgres half of the migration surface (#330). The `check` job above runs
  # the default suite, which is SQLite-only. The two drivers share their entire
  # CRUD body (ADR-0003 §1) but keep SEPARATE migration directories, so the
  # migration SQL is the one place the dialects genuinely diverge — the
  # least-shared code was the least-tested code, and until this job existed every
  # migration this repo shipped reached Postgres users without CI ever applying it.
  #
  # Reading a migration catches whether the SQL expresses the intended set. It
  # cannot catch whether Postgres accepts the statement at all — a type it does
  # not have, an index shape it refuses, a form it parses differently. Only
  # applying it to a running server catches that, and that failure otherwise
  # surfaces on a user's upgrade rather than in a test run.
  postgres:
    runs-on: ubuntu-latest
    strategy:
      # Report both versions independently — if a migration breaks on one of them
      # only, that is the single most useful thing this job can tell you, and
      # cancelling the sibling would withhold it.
      fail-fast: false
      matrix:
        # Two versions because the project does not currently have one. The compose
        # files (docker-compose.yml, docs/docker-compose.yml) ship 17.2-alpine, so
        # that is what anyone following the quick start runs; the deployment that
        # exists today runs 18.4. Pinning either alone would leave the other
        # untested, so both run and a migration must satisfy both.
        #
        # Converging those numbers is a real decision someone has to make, and it
        # is deliberately NOT made here — this job records the divergence in the
        # workflow file rather than papering over it. Treat a bump as a change that
        # moves together with the compose files.
        #
        # ⚠️ These two jobs are REQUIRED status checks on main, and a matrix job
        # registers its context under the expanded name — "postgres (postgres:18.4)"
        # is a literal string in the branch protection settings. So changing an image
        # here renames the context: the new name is not required and the old one stays
        # required and can never report again. A required check that never reports does
        # not fail, it stays pending forever, and that blocks every PR in the repo —
        # a routine version bump arriving as a permanent pending state with no failing
        # job to point at. The matrix and the protection list have to move together.
        postgres-image:
          - postgres:17.2-alpine
          - postgres:18.4
    services:
      postgres:
        image: ${{ matrix.postgres-image }}
        env:
          POSTGRES_USER: yaadegar
          POSTGRES_DB: yaadegar_test
          # No password at all, rather than a throwaway one written into the file.
          # This server is created for one job, is reachable only from that job over
          # its own loopback, and is destroyed with it -- so a credential here would
          # protect nothing while putting a password-shaped string in the repository.
          POSTGRES_HOST_AUTH_METHOD: trust
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U yaadegar -d yaadegar_test"
          --health-interval 3s
          --health-timeout 3s
          --health-retries 20
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Go
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod

      - name: Run the Postgres integration suite
        env:
          YAADEGAR_TEST_POSTGRES_DSN: postgres://yaadegar@localhost:5432/yaadegar_test?sslmode=disable
        run: |
          set -euo pipefail

          # A green `go test` is NOT evidence this ran. newPostgresStore() calls
          # t.Skip() when YAADEGAR_TEST_POSTGRES_DSN is empty, so a service that
          # never came up — or an env value that never reached this step — yields
          # nothing but SKIPs and exit 0. That is a job which is green having
          # executed nothing, and at the status tick it is indistinguishable from a
          # working one. Confirmed by running the suite with the variable unset:
          # every test skipped, exit code 0.
          #
          # So assert on the outcome instead of the exit status. `-list` enumerates
          # the tests that exist; every one of them must then report PASS. Deriving
          # the expectation from the source rather than from a literal count means a
          # seventh test raises the bar without anyone remembering to, and a build
          # tag that stops matching empties the list and fails here instead of
          # passing vacuously.
          # `-list` also prints a trailing "ok <pkg> <elapsed>" line, so filter to
          # the names. The `|| true` keeps a no-match grep (exit 1) from killing the
          # script under `set -e` before the check below can say why — without it
          # the empty case still fails, but with no diagnostic, and the branch that
          # explains it is unreachable.
          go test -tags=integration -list 'TestPostgres' ./internal/storage/sqlstore/ \
            > "$RUNNER_TEMP/list.txt"
          { grep '^TestPostgres' "$RUNNER_TEMP/list.txt" || true; } \
            | sort > "$RUNNER_TEMP/expected.txt"
          if [ ! -s "$RUNNER_TEMP/expected.txt" ]; then
            echo "found no TestPostgres* tests to run: the integration suite is not being built (build tag changed, or the file moved)"
            exit 1
          fi

          go test -tags=integration -race -v -run 'TestPostgres' ./internal/storage/sqlstore/ \
            2>&1 | tee "$RUNNER_TEMP/run.log"

          # Top-level PASS lines only — subtest results are indented.
          sed -n 's/^--- PASS: \(TestPostgres[^ ]*\).*/\1/p' "$RUNNER_TEMP/run.log" \
            | sort > "$RUNNER_TEMP/passed.txt"
          if ! diff -u "$RUNNER_TEMP/expected.txt" "$RUNNER_TEMP/passed.txt"; then
            echo "a Postgres integration test that exists did not report PASS (the '-' lines above); a skip means the database was never reached"
            exit 1
          fi
          echo "all $(wc -l < "$RUNNER_TEMP/expected.txt") Postgres integration tests executed and passed, migrations applied to ${{ matrix.postgres-image }}"

  # Guard the link-time version stamp (#190). The stamp lives in the Dockerfile
  # link flags + the publish workflow's build-arg — both outside the Go build the
  # `check` job exercises — so nothing above would notice the flag being dropped,
  # and docker-publish.yml has no pull_request trigger to catch it before a
  # release. This runs on every PR: it builds the image with a known version and
  # asserts the `version` subcommand hands the same value back, failing the PR
  # that breaks the stamp rather than discovering it after a release ships "dev".
  # Boundary: this guards the Dockerfile link-flag wiring; it supplies its own
  # VERSION, so a green run here does not prove the publish workflow still passes
  # its build-arg — that residual is covered by the release-only pre-publish gate
  # in docker-publish.yml and the publish-forwards-version job below (#193).
  # The single Postgres context branch protection should require (#341).
  #
  # A matrix job registers one status context per leg, under its EXPANDED name —
  # "postgres (postgres:18.4)" is a literal string in the settings. So changing an
  # image renames the context: the new name is not required, and the old name stays
  # required and can never report again. A required check that never reports does not
  # fail — it stays pending, and a pull request in that state cannot be merged by
  # anyone. A routine one-line version bump then blocks every pull request in the
  # repository, with no failing job to point at, on changes made by people who did
  # not touch this file.
  #
  # This job's name does not move when the matrix does, so requiring it removes the
  # coupling rather than policing it. The matrix can gain versions, lose versions or
  # rename them with no settings change and nothing to keep in sync.
  #
  # 🚨 `needs:` plus `if: always()` makes this job RUN whatever the matrix did. It
  # does NOT make it fail. A body that runs after a failed matrix and does nothing
  # reports success — a required context that can never go red, which is strictly
  # worse than the coupling it replaces because it looks exactly like a working
  # guard. So the result is inspected explicitly and the DEFAULT is failure: only
  # `success` passes, and `failure`, `cancelled` and `skipped` are all not-green.
  # Passing has to be a decision this job actively reaches.
  #
  # `needs.postgres.result` is the matrix's aggregate outcome, so it already covers
  # every leg — including legs added later, which is the property being bought.
  #
  # ⚠️ Why treating `skipped` as not-green is safe HERE, recorded because the answer
  # lives in a different part of this file from the rule and a skip-fails decision is
  # exactly the kind that blocks unrelated people a week later. The matrix carries no
  # `if:`, no path filter and no `needs:`, and this workflow fires on every pull
  # request to main and every push to it — so the only routes to `skipped` are a
  # cancelled run or a manual intervention, and both should block a merge.
  #
  # This is therefore NOT the never-reports-so-never-passes shape that keeps the
  # path-filtered `web` workflow out of the required contexts: that one is legitimately
  # absent on most commits, where this one is absent only when something went wrong.
  # Adding an `if:` or a path filter to the matrix would break that argument and make
  # this job block every commit the filter excludes.
  postgres-suite:
    runs-on: ubuntu-latest
    needs: [postgres]
    if: always()
    steps:
      - name: Require every Postgres version to have passed
        env:
          RESULT: ${{ needs.postgres.result }}
        run: |
          set -euo pipefail

          # A case with an explicit success arm and a catch-all failure arm, rather
          # than a test for failure: a state nobody anticipated must land in the
          # failing branch, not the passing one.
          case "$RESULT" in
            success)
              echo "every Postgres version passed"
              ;;
            failure)
              echo "at least one Postgres version failed (#341): this context is red so the merge is blocked, and the per-version job above names which one"
              exit 1
              ;;
            cancelled|skipped)
              echo "the Postgres matrix was '${RESULT}', so no version was verified (#341): absence of a failure is not a pass, and this context refuses to report green on evidence that was never produced"
              exit 1
              ;;
            *)
              echo "the Postgres matrix reported '${RESULT}', which this job does not recognise (#341): refusing to pass on an outcome nobody anticipated"
              exit 1
              ;;
          esac

  version-stamp:
    runs-on: ubuntu-latest
    env:
      # A sentinel fed to both the build-arg and the assertion below, so the check
      # passes only if the value round-trips through the real link flags. It must
      # NOT be "dev": with no build-arg the Dockerfile default supplies "dev", and
      # the round-trip would then compare dev-to-dev and pass while proving nothing
      # — green in the exact workflow added to protect this. A value that cannot
      # arise by accident keeps the three outcomes diagnosable:
      #   v0.0.0-citest reported → stamp wiring is correct
      #   dev reported           → the build-arg never arrived
      #   empty reported         → the ARG is out of the build stage (see Dockerfile)
      STAMP_VERSION: v0.0.0-citest
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      # A plain single-platform `docker build` loads into the local daemon, so the
      # image can be run here — a multi-arch buildx build (as the publish job does)
      # could not be `docker run`.
      # Known flake mode, accepted knowingly: this pulls the builder base from
      # Docker Hub on every PR, and anonymous pulls from shared runners are
      # rate-limited. Kept as a plain build to keep this assert job minimal; if the
      # flake shows up, wire it through buildx with `cache-from: type=gha` (as the
      # publish job caches) rather than authenticating.
      - name: Build the image with an injected version
        run: docker build --build-arg VERSION="$STAMP_VERSION" --tag yaadegar:version-stamp-test .

      - name: Assert the version subcommand reports the injected version
        run: |
          got="$(docker run --rm yaadegar:version-stamp-test version)"
          if [ "$got" != "$STAMP_VERSION" ]; then
            echo "version subcommand reported '$got', want '$STAMP_VERSION': link-time version stamping is broken (#190)"
            exit 1
          fi
          echo "version stamp round-trips: $got"

  # The web image's counterpart to version-stamp above (#268): the publish workflow
  # bakes the resolved version into YAADEGAR_VERSION via a VERSION build-arg, and the
  # running server reports it off process.env. docker-publish.yml verifies this too,
  # but only on a release (its verify phase is release-gated), so this asserts it at
  # PR time — the change that drops the web build-arg fails here, not after a release.
  web-version-stamp:
    runs-on: ubuntu-latest
    env:
      # Same sentinel rationale as version-stamp: NOT "dev" (the Dockerfile default),
      # so a dropped build-arg reports "dev" and fails here rather than round-tripping
      # dev-to-dev and passing while proving nothing.
      STAMP_VERSION: v0.0.0-citest
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      # Plain single-platform build so the image loads locally and can be run here.
      # Same accepted Hub-rate-limit flake mode as version-stamp above.
      - name: Build the web image with an injected version
        run: docker build --build-arg VERSION="$STAMP_VERSION" --tag yaadegar-web:version-stamp-test ./web

      - name: Assert the web server reports the injected version
        run: |
          # Read the stamp the way the running server does — off process.env, by
          # overriding the CMD with node (the web image is a server, not a CLI).
          got="$(docker run --rm yaadegar-web:version-stamp-test node -e 'process.stdout.write(process.env.YAADEGAR_VERSION || "")')"
          if [ "$got" != "$STAMP_VERSION" ]; then
            echo "web image reports '$got', want '$STAMP_VERSION': the VERSION build-arg no longer bakes into YAADEGAR_VERSION (#268)"
            exit 1
          fi
          echo "web version stamp round-trips: $got"

  # A source build (no VERSION build-arg) must report the nearest release tag, not a
  # bare commit (#259). Both cases are asserted against a real image build: with tags
  # reachable it derives the tag (fetch-depth: 0 pulls them — the default shallow
  # checkout has none), and with no matching tags — the shallow `git clone --depth 1`
  # case an operator actually hits — it falls back to a bare commit that reads as
  # distinct-from-a-version rather than a misleading one. The published release path
  # still emits a pure semver: that is the version-stamp job above, which passes
  # VERSION explicitly and so never reaches this derivation.
  derived-version-stamp:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout with full history and tags
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          # The default shallow checkout carries no tags, which is exactly the
          # no-tag case exercised further down — so pull everything here to make the
          # with-tags assertion non-vacuous.
          fetch-depth: 0

      - name: Build with no version build-arg
        run: docker build --build-arg VERSION= --tag yaadegar:derived-tag .

      - name: Assert the source build reports the nearest release tag
        run: |
          # Re-derive the expected value exactly as the Dockerfile does, from the same
          # checkout, so the assertion tracks the build rather than hard-coding a value.
          want="$(git describe --tags --always --dirty --match 'yaadegar-v*')"
          want="${want#yaadegar-v}"
          # Guard against a vacuous pass: if no release tag is reachable, `want` would
          # be a bare commit and the equality below would hold without testing the tag
          # path at all. A derived version starts with a digit after the prefix strip.
          case "$want" in
            [0-9]*) : ;;
            *) echo "no release tag reachable in this checkout — fetch-depth: 0 not applied? (#259)"; exit 1 ;;
          esac
          got="$(docker run --rm yaadegar:derived-tag version)"
          if [ "$got" != "$want" ]; then
            echo "source build reported '$got', want '$want': the nearest-release-tag derivation is broken (#259)"
            exit 1
          fi
          echo "source build reports the release-derived version: $got"

      - name: Assert a build with no reachable tags falls back to a bare commit
        run: |
          # Drop the release tags and rebuild: the derivation must fall back to the
          # bare commit (git describe --always), distinct from a semver rather than a
          # zero-ish placeholder that would read like a real release.
          git tag -l 'yaadegar-v*' | xargs -r git tag -d
          docker build --build-arg VERSION= --tag yaadegar:derived-notag .
          got="$(docker run --rm yaadegar:derived-notag version)"
          if printf '%s' "$got" | grep -Eq '^[0-9a-f]{7,40}(-dirty)?$'; then
            echo "no-tag source build falls back to a bare commit: $got"
          else
            echo "no-tag source build reported '$got', want a bare commit hash (#259): the shallow-clone fallback is wrong"
            exit 1
          fi

  # Guard the publish gate (#356), in two parts that answer different questions.
  #
  # ⚠️ The job id says "declared" and is now narrower than the job. It keeps that id
  # because it is bound as a required check on main and renaming it would silently
  # unbind it — a context that never reports never fails. The difference lives here.
  #
  # PART ONE asserts docker-publish.yml still says the right words: publish needs the
  # gate, the gate runs the script, the script consults ci.yml and not path-filtered
  # web.yml. This is evidence about TEXT. It cannot tell you the gate would block
  # anything, and treating it as such is the same substitution the issue it comes from
  # is about — a probe that only exercises the build cannot distinguish a repo with
  # tests from one without.
  #
  # PART TWO runs the gate's poll loop against a stub (#359), which is what covers
  # behaviour. Before the loop was extracted to a script it could not be invoked at
  # all: it had been exercised by hand while it was written, and evidence about one
  # revision is not coverage — a regression in it would have left every check green.
  #
  # ⚠️ What neither part proves: that the real Actions API answers in the shape the
  # stub emits. A hand-written stub encodes what its author believed the format to be.
  # That residual is narrow rather than absent — the live gate has parsed real replies
  # over many ticks, so the success path's shape is confirmed by production, and the
  # failure path parses nothing because the call itself fails. It is stated because
  # "the tests pass" would otherwise cover a belief as well as a behaviour.
  #
  # All of it exists because docker-publish.yml has no pull_request trigger, so nothing
  # else in this repository looks at that file at PR time: deleting `needs: require-suite`
  # would restore publishing-from-untested-commits silently, with every check green,
  # and the next reader of a published image would have no way to notice. Same idiom
  # and same reasoning as publish-forwards-version below.
  publish-gate-declared:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Assert docker-publish still declares its dependency on a suite run
        run: |
          set -euo pipefail
          wf=.github/workflows/docker-publish.yml
          gate=require-suite
          script=.github/scripts/require-suite-run.sh

          # Isolate one job: from its `  <id>:` header to the next one, scanning only
          # after `jobs:`. Job-level keys sit at 4 spaces and step bodies deeper, so a
          # bare 2-space `key:` inside a job cannot end a block early.
          job_block() {
            awk -v want="  $1:" '
              /^jobs:$/                     { injobs = 1; next }
              !injobs                       { next }
              /^  [A-Za-z0-9_-]+:$/         { inblock = ($0 == want) }
              inblock                       { print }
            ' "$wf"
          }

          gate_block="$(job_block "$gate")"
          if [ -z "$gate_block" ]; then
            echo "no '$gate' job in $wf (#356): the job that requires a green suite run for the commit being published is gone, or was renamed without updating this check"
            exit 1
          fi

          publish_block="$(job_block publish)"
          if [ -z "$publish_block" ]; then
            echo "no 'publish' job in $wf (#356): renamed? this check can no longer find what it guards"
            exit 1
          fi

          # Collect the needs declaration in EITHER YAML form: inline on the key
          # (`needs: x`, `needs: [x, y]`) or a block sequence beneath it. Matching only
          # the inline form would report the dependency as GONE after a purely
          # cosmetic reformat — a false alarm that says "publishing is ungated" about a
          # file where it is still gated, which is worse than silence because someone
          # would go looking for a break that is not there.
          needs_decl="$(printf '%s\n' "$publish_block" | awk '
            /^    needs:/                { inneeds = 1; print; next }
            inneeds && /^      *[-#]/    { print; next }
            inneeds                      { inneeds = 0 }
          ')"

          if [ -z "$needs_decl" ]; then
            echo "the publish job in $wf declares no 'needs:' at all (#356): images would publish from a commit with no suite run again, and every check in this repository would stay green while it happened"
            exit 1
          fi

          # Word boundaries by hand: `require-suite` must not be satisfied by a
          # longer id that merely contains it.
          if ! printf '%s\n' "$needs_decl" | grep -Eq "(^|[^A-Za-z0-9_-])${gate}([^A-Za-z0-9_-]|$)"; then
            echo "the publish job in $wf no longer needs '$gate' (#356): images would publish from a commit with no suite run again, and every check in this repository would stay green while it happened"
            exit 1
          fi

          # The gate must still run the script. Without this the job could survive as
          # an empty shell that satisfies the needs edge above and gates nothing.
          #
          # ⚠️ The two content checks below moved here from the job block when the
          # loop was extracted (#359). They read the SCRIPT because that is where the
          # text now lives; left pointing at the job block they would have passed
          # trivially forever, since the block no longer contains either string —
          # a guard that cannot fail, in the file whose whole subject is guards that
          # cannot fail.
          if ! printf '%s\n' "$gate_block" | grep -q "$script"; then
            echo "the '$gate' job in $wf no longer runs $script (#356, #359): the needs edge would still be declared while the gate asserts nothing"
            exit 1
          fi

          if [ ! -x "$script" ]; then
            echo "$script is missing or not executable (#359): the gate job would fail on every publish, or worse, be quietly edited to inline something else"
            exit 1
          fi

          if ! grep -q 'workflows/ci\.yml/runs' "$script"; then
            echo "$script no longer looks up a ci.yml run (#356): the needs edge would still be declared while the gate asserts nothing"
            exit 1
          fi

          # web.yml is path-filtered and legitimately does not run on most commits, so
          # waiting for one of its runs would hang until timeout and block publishing
          # from any commit that did not touch web/ — the never-reports-so-never-passes
          # shape that keeps `web` out of the required checks on main. Catch it as a
          # text change here rather than as a stuck release later.
          if grep -q 'workflows/web\.yml/runs' "$script"; then
            echo "$script waits on a web.yml run (#356): web.yml is path-filtered, so on a commit that touches no web path that run never exists and the gate would block the publish forever"
            exit 1
          fi

          # 🚨 Both jobs must check out the commit the gate verified. require-suite
          # proves a green suite run exists for github.sha; the publish checkout
          # decides which tree is built. If those ever resolved differently, the gate
          # would pass on one commit while the image came from another and the whole
          # guarantee would be false with every check green. The default ref happens
          # to resolve correctly for the triggers this file declares today, which is
          # a coincidence of the trigger list rather than a property — so it is
          # pinned, and asserted here so a later edit cannot quietly unpin it.
          for job in "$gate" publish; do
            if ! printf '%s\n' "$(job_block "$job")" | grep -q 'ref: .*github\.sha'; then
              echo "the '$job' job in $wf checks out without pinning ref to github.sha (#356): the gate proves a run exists for that commit, and an unpinned checkout lets a later trigger build a different tree while the gate still passes"
              exit 1
            fi
          done

          echo "publish gate is declared: publish needs $gate, $gate runs $script, which consults ci.yml and does not wait on path-filtered web.yml; both jobs check out github.sha"

      # 🚨 The declaration checks above say the wiring is intact. They do not run the
      # loop, which is what #359 is about: its shipped defect was a per-tick log line
      # computed from the wrong variable, and no amount of asserting that the YAML
      # still says the right words could have seen it.
      #
      # This step runs the extracted script against a stub `gh`, over every branch
      # including the ones no live run has ever taken — a tolerated API blip, a
      # lookup that never succeeds, a run concluded `failure`.
      #
      # ⚠️ It lives in THIS job rather than a new one deliberately. A new job would
      # not be a required check until branch protection was edited, so it would run
      # green beside a regression and gate nothing — which is precisely the state
      # this issue exists to end. The job id therefore now understates what the job
      # does; renaming it would break the required-context binding, so the id stays
      # and this comment carries the difference.
      - name: Run the publish gate's poll loop against a stubbed API
        run: .github/scripts/require-suite-run.test.sh

  # Observe that BOTH publish steps still forward VERSION into their multi-arch
  # builds (#193, extended to the matched pair in #268). The release-only pre-publish
  # gates in docker-publish.yml build their own single-arch images to prove each stamp
  # works end to end, but they supply their own build-arg — so they cannot notice if a
  # *publish* step stops forwarding the value. Deleting a publish step's build-args
  # block leaves that gate green (it builds a different image), the resolved-value gate
  # green (it validates a string), and only the post-push read notices, once `latest`
  # has moved: the exact after-the-fact shape #193 removes. The guards are
  # complementary — the pre-publish gates exercise the production build path, this one
  # observes the push steps keep their forwarding — and each leaves the other's hole
  # open alone. This is a text check on the workflow file, scoped to the two push
  # steps by name so the pre-publish gates' own build-args blocks cannot mask a deleted
  # one, and it asserts EACH forwards VERSION — a grep that passed on either alone
  # would let one image ship dev-stamped while the other is correct, which is the
  # mismatched pair #268 prevents. It runs on every PR, failing the change that drops
  # the forwarding rather than a release.
  publish-forwards-version:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Assert both publish steps forward the resolved version build-arg
        run: |
          wf=.github/workflows/docker-publish.yml
          # Check each named push step independently. Isolate a step: from its
          # `- name:` header until the next step boundary — the next `- name:` header
          # OR the next step's leading comment (a `#` at the 6-space step indent).
          # Stopping at the comment matters because comments at this level explain the
          # forwarding, so over-running into the next step's comment could let a stray
          # `VERSION=` there satisfy the check. Step-body comments sit deeper (8+
          # spaces) and are kept. `index()` matches the full step name, and the two
          # names differ past their shared prefix, so each matches only its own step.
          fail=0
          for step in "Build and push the API image by digest" "Build and push the web image by digest"; do
            block="$(awk -v want="$step" '
              /^      - name: / { instep = (index($0, want) > 0) ? 1 : 0 }
              /^      #/        { instep = 0 }
              instep            { print }
            ' "$wf")"
            if [ -z "$block" ]; then
              echo "could not locate the publish step (- name: $step) in $wf (#268): renamed? the matched-pair forwarding check can no longer find its target"
              fail=1; continue
            fi
            if ! printf '%s\n' "$block" | grep -q 'build-args:'; then
              echo "publish step '$step' has no build-args block — the resolved version is no longer forwarded (#193/#268)"
              fail=1; continue
            fi
            if ! printf '%s\n' "$block" | grep -Eq 'VERSION=.*steps\.meta\.outputs\.version'; then
              echo "publish step '$step' no longer forwards the resolved version as a VERSION build-arg set to steps.meta.outputs.version (#193/#268): a dev-stamped image would ship and only the post-push assert would notice"
              fail=1; continue
            fi
            echo "publish step '$step' forwards the resolved version: OK"
          done
          exit "$fail"
