name: CI

on:
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Go
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          # Track the version pinned in go.mod so CI and the module stay in
          # lockstep — single source of truth.
          go-version-file: go.mod

      - name: Build
        run: go build ./...

      # Regenerate from api/openapi.yaml (oapi-codegen pinned in go.mod) and fail
      # if the checked-in generated code drifts from the spec — they must match.
      - name: Verify generated code is in sync with the spec
        run: make verify-generate

      - name: Vet
        run: go vet ./...

      - name: Gofmt
        run: |
          unformatted="$(gofmt -l .)"
          if [ -n "$unformatted" ]; then
            echo "These files are not gofmt-formatted:"
            echo "$unformatted"
            exit 1
          fi

      - name: Lint
        uses: golangci/golangci-lint-action@ba0d7d2ec06a0ea1cb5fa41b2e4a3ab91d21278a # v9.3.0
        with:
          # Pin the linter version so CI matches the local run (same reasoning as
          # go-version-file above); Dependabot bumps it deliberately.
          version: v2.11.4

      - name: Test
        run: go test -race ./...

  # Guard the link-time version stamp (#190). The stamp lives in the Dockerfile
  # link flags + the publish workflow's build-arg — both outside the Go build the
  # `check` job exercises — so nothing above would notice the flag being dropped,
  # and docker-publish.yml has no pull_request trigger to catch it before a
  # release. This runs on every PR: it builds the image with a known version and
  # asserts the `version` subcommand hands the same value back, failing the PR
  # that breaks the stamp rather than discovering it after a release ships "dev".
  # Boundary: this guards the Dockerfile link-flag wiring; it supplies its own
  # VERSION, so a green run here does not prove the publish workflow still passes
  # its build-arg — that residual is covered by the release-only pre-publish gate
  # in docker-publish.yml and the publish-forwards-version job below (#193).
  version-stamp:
    runs-on: ubuntu-latest
    env:
      # A sentinel fed to both the build-arg and the assertion below, so the check
      # passes only if the value round-trips through the real link flags. It must
      # NOT be "dev": with no build-arg the Dockerfile default supplies "dev", and
      # the round-trip would then compare dev-to-dev and pass while proving nothing
      # — green in the exact workflow added to protect this. A value that cannot
      # arise by accident keeps the three outcomes diagnosable:
      #   v0.0.0-citest reported → stamp wiring is correct
      #   dev reported           → the build-arg never arrived
      #   empty reported         → the ARG is out of the build stage (see Dockerfile)
      STAMP_VERSION: v0.0.0-citest
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      # A plain single-platform `docker build` loads into the local daemon, so the
      # image can be run here — a multi-arch buildx build (as the publish job does)
      # could not be `docker run`.
      # Known flake mode, accepted knowingly: this pulls the builder base from
      # Docker Hub on every PR, and anonymous pulls from shared runners are
      # rate-limited. Kept as a plain build to keep this assert job minimal; if the
      # flake shows up, wire it through buildx with `cache-from: type=gha` (as the
      # publish job caches) rather than authenticating.
      - name: Build the image with an injected version
        run: docker build --build-arg VERSION="$STAMP_VERSION" --tag yaadegar:version-stamp-test .

      - name: Assert the version subcommand reports the injected version
        run: |
          got="$(docker run --rm yaadegar:version-stamp-test version)"
          if [ "$got" != "$STAMP_VERSION" ]; then
            echo "version subcommand reported '$got', want '$STAMP_VERSION': link-time version stamping is broken (#190)"
            exit 1
          fi
          echo "version stamp round-trips: $got"

  # Observe that the publish workflow still forwards VERSION into the multi-arch
  # build (#193). The release-only pre-publish gate in docker-publish.yml builds
  # its own single-arch image to prove the stamp works end to end, but it supplies
  # its own build-arg — so it cannot notice if the *publish* step stops forwarding
  # the value. Deleting the publish step's build-args block leaves that gate green
  # (it builds a different image), the resolved-value gate green (it validates a
  # string), and only the post-push read notices, once `latest` has moved: the
  # exact after-the-fact shape #193 removes. The two guards are complementary —
  # the pre-publish gate exercises the production build path, this one observes the
  # push step keeps its forwarding — and each leaves the other's hole open alone.
  # This is a text check on the workflow file, scoped to the publish step (the one
  # named "Build and push") so the pre-publish gate's own build-args block cannot
  # mask a deleted one. It runs on every PR, failing the change that drops the
  # forwarding rather than a release.
  publish-forwards-version:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Assert the publish step forwards the resolved version build-arg
        run: |
          wf=.github/workflows/docker-publish.yml
          # Isolate the "Build and push" step: every line from its `- name:` header
          # until the next step header at the same indent.
          block="$(awk '/^      - name: / { instep = ($0 ~ /Build and push/) ? 1 : 0 } instep { print }' "$wf")"
          if [ -z "$block" ]; then
            echo "could not locate the publish step (- name: Build and push) in $wf (#193): rename? the forwarding check can no longer find its target"
            exit 1
          fi
          if ! printf '%s\n' "$block" | grep -q 'build-args:'; then
            echo "publish step has no build-args block — the resolved version is no longer forwarded (#193)"
            exit 1
          fi
          if ! printf '%s\n' "$block" | grep -Eq 'VERSION=.*steps\.meta\.outputs\.version'; then
            echo "publish step no longer forwards the resolved version as a VERSION build-arg set to steps.meta.outputs.version (#193): a dev-stamped image would ship and only the post-push assert would notice"
            exit 1
          fi
          echo "publish step forwards the resolved version: OK"
