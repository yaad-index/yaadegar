# Automated semantic-version releases from Conventional Commits (#29).
#
# On every push to main, release-please maintains a "release PR" that
# accumulates the changelog + next version from the conventional-commit
# history. Merging that PR tags the release (vMAJOR.MINOR.PATCH) and
# publishes a GitHub Release. Pre-1.0 is expected to start.
#
# BRANCH-PROTECTION NOTE (read before cutting the first release):
# The release PR is opened with GITHUB_TOKEN by default, and GitHub does
# not trigger workflows for GITHUB_TOKEN-authored events — so the required
# `check` status will NOT run on the release PR on its own, and it cannot
# merge until it does. Until a RELEASE_PLEASE_TOKEN secret is added (see
# below), a maintainer must close and reopen the release PR once: reopening
# it as a real user fires the pull_request event and `check` runs. See
# RELEASING.md.
#
# ONE-LINE UPGRADE (optional, removes the manual step):
# Add a RELEASE_PLEASE_TOKEN repo secret — a fine-grained PAT or GitHub App
# token with `contents: write` + `pull_requests: write`. The token
# expression below picks it up automatically; no workflow edit needed. The
# release PR is then authored by that identity, so `check` runs normally and
# the flow is a plain CI-green + 2-approvals merge like any other PR.

name: release-please

on:
  push:
    branches: [main]

permissions:
  contents: write
  pull-requests: write

jobs:
  release-please:
    runs-on: ubuntu-latest
    steps:
      - name: Run release-please
        id: release
        uses: googleapis/release-please-action@45996ed1f6d02564a971a2fa1b5860e934307cf7 # v5.0.0
        with:
          # Uses the optional RELEASE_PLEASE_TOKEN secret when present (so the
          # release PR triggers CI), else falls back to the built-in token
          # (needs the one-time close/reopen per the note above).
          token: ${{ secrets.RELEASE_PLEASE_TOKEN || secrets.GITHUB_TOKEN }}
          config-file: release-please-config.json
          manifest-file: .release-please-manifest.json

      # Request reviewers on the release PR (#343).
      #
      # This PR class is the only one whose author can never approve it — GitHub
      # forbids approving your own pull request, which is a platform constraint no
      # review policy can relax. It was also the only class arriving with nobody
      # requested. Each fact is harmless alone; together they mean the pull request
      # that most depends on someone else noticing it notified no one, and it does
      # not fail, it sits: nobody requested is indistinguishable from reviewers who
      # have not got to it yet.
      #
      # 🚨 REVIEWERS ARE THE IDENTITIES THAT CAN APPROVE THIS PR, and whoever opens
      # it is deliberately NOT among them. Adding that identity for symmetry is the
      # obvious later edit and it is wrong: the request can never be satisfied, so
      # it restores the same silence this step removes while wearing a reviewer
      # badge. Which identity opens it depends on whether RELEASE_PLEASE_TOKEN is
      # set, which is why the rule is "whoever opened it cannot review it" rather
      # than a name.
      #
      # 🚨 `prs_created` DOES NOT MEAN WHAT ITS NAME SUGGESTS, and reading it as
      # "only on creation" is the mistake this comment exists to prevent. Verified
      # against the action's own source (Manifest.createOrUpdatePullRequest /
      # maybeUpdateExistingPullRequest): it is true on ANY body change to an
      # already-open release pull request, and false only on a byte-identical
      # rewrite. Since release-please rewrites that PR on every push to main, this
      # step fires on most pushes to trunk, not on creation.
      #
      # ⚠️ So idempotency does NOT rest on this condition. Re-requesting someone who
      # has already approved can reset that approval, and a release PR whose
      # approvals evaporate whenever trunk moves reads as reviewers being slow
      # rather than as an automation undoing their work. The script reads the
      # current reviewers AND reviews first and asks only for who is missing from
      # both, which makes it safe against an already-open PR by construction. The
      # condition is kept only as a cheap skip on the no-change case.
      #
      # The body is a script rather than an inline block so it can be run against a
      # stub and asserted (#359); ci.yml runs its tests on every pull request.
      #
      # ⚠️ The script is SHARED with docs-compose.yml, which opens the docs pin bump
      # PR with the same problem (#343). It takes a pull request number and nothing
      # about where the number came from, so neither caller carries a variant of the
      # logic. Changing it means checking both callers, not this one.
      #
      # The step name says "the release pull request" and not "a newly created" one
      # on purpose — see the prs_created note above. The old name asserted the very
      # thing that note exists to deny, in the same file, two lines apart.
      #
      # 🚨 THE `pr &&` IS LOAD-BEARING AND MUST NOT BE TIDIED AWAY. Without it this
      # step broke the workflow on the very next push to main, and it is worth being
      # exact about why, because the version that shipped carried a comment arguing
      # confidently FOR the broken form.
      #
      # `steps.release.outputs.pr` is an EMPTY STRING whenever release-please does not
      # cut a release pull request, and `fromJSON('')` throws:
      #
      #   The template is not valid. … Error reading JToken from JsonReader.
      #   Path '', line 0, position 0.
      #
      # ⚠️ AND THE `if:` BELOW DOES NOT PROTECT IT. A step's `env:` block is evaluated
      # even when the step is SKIPPED, so the job fails rather than the step being
      # passed over. Confirmed by running it, not reasoned about: a skipped step whose
      # env called `fromJSON` on an empty output failed with that identical error,
      # while the same step with the `pr &&` guard succeeded, and the guard still
      # yielded the number on a real payload. `&&` short-circuits, so `fromJSON` is
      # never reached when the output is empty.
      #
      # ⚠️ The premise of the old comment is the part that was wrong, and it is the
      # part worth remembering. It called an absent output "a case that should not
      # happen" and chose a loud failure for it, which is the right instinct applied
      # to a false fact: an absent output is the NORMAL outcome of every push to main
      # that carries no releasable commits, which is most of them. The commit that
      # broke it was an ordinary `ci:` commit. A correct argument from a false premise
      # reads exactly like a correct argument.
      #
      # ✅ The loudness it was reaching for is still here, on the case that actually
      # warrants it. If `prs_created` is true while the output is empty, PR_NUMBER
      # arrives empty and the SCRIPT's own "carries no usable number" guard exits 1 —
      # reachable because that guard takes `?` rather than `:?`. So a pull request
      # that exists and cannot be identified still fails loudly; only a push with no
      # release to cut is now quiet, which is correct because nothing happened.
      - name: Request reviewers on the release pull request
        if: steps.release.outputs.prs_created == 'true'
        env:
          GH_TOKEN: ${{ secrets.RELEASE_PLEASE_TOKEN || secrets.GITHUB_TOKEN }}
          REPO: ${{ github.repository }}
          PR_NUMBER: ${{ steps.release.outputs.pr && fromJSON(steps.release.outputs.pr).number }}
          REVIEWERS: forge-rubigd sora-rubigd
        run: .github/scripts/request-pr-reviewers.sh
