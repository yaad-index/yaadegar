# Prove the documented self-hosting compose actually serves a site (#270,
# ADR-0014 §4). A quick-start compose is copy-pasted rather than read, so it has to
# be RUN, not reviewed — and asserting that containers merely start is exactly the
# signal that cannot tell #258 (a healthy API serving no website) apart from a
# working instance. So this stands up docs/docker-compose.yml end to end and asserts
# the web service renders a real page and proxies the API.
#
# Cost, accepted with eyes open (ADR-0014 §4): this pulls two images, waits on
# Postgres and the app health gate, and asserts on a rendered response, so it is the
# slowest and least deterministic job here. It runs only on a release and on changes
# to the compose or either Dockerfile — not on every push — and a flake here gets
# FIXED, not retried away: a quick start that passes only on a re-run is not one an
# operator can trust.
#
# Tag note (#275): the 0.13.0 release publishes BOTH images, so this now runs the
# compose exactly as the docs hand it to a self-hoster — against the pinned version
# tag its default names (currently :0.13.0), not a rolling :main stand-in. CI thus
# proves the specific artifact an operator would pull. The pinned default trails the
# most-recent release until bumped, so on a release event it resolves to an
# already-published tag rather than the one that release is still publishing.
#
# Staleness reconcile (#278): serves-a-site keeps the pin TRAILING (above), so nothing
# here forces it forward — a release leaves the docs naming the previous version until a
# small bump PR moves the pin. The pin-is-current job below closes that gap WITHOUT
# disturbing the trailing pin and WITHOUT a red on every release: it pulls no image (so it
# cannot race docker-publish the way a fresh pin would), it hard-fails a wrong pin only on
# a pull_request, and on a release or a main push it keeps a single self-closing tracking
# issue in sync instead of failing.
#
# ⚠️ The bump is AUTOMATED (#307) and this paragraph used to say it stays manual. The
# reason it gave was correct and is still the constraint: auto-bumping makes the pulling
# job race the publish, because imagetools applies the fresh tag late. What changed is
# WHEN the bump runs, not whether the race is real — the PR is opened after
# docker-publish succeeds for the release, not on the release event. Opening it on the
# release event is exactly the bug this sentence predicted, and it shipped anyway while
# the sentence sat here unread (#319). The reason also lives at the pin in
# docs/docker-compose.yml and in #275.

name: docs-compose

on:
  release:
    types: [published]
  # The bump PR waits on this, not on the release event (#319). Releasing and
  # publishing images are two different moments: `release: published` fires while
  # docker-publish is still building, so a PR opened there pins a tag that does
  # not exist yet and serves-a-site pulls it into `manifest unknown`.
  workflow_run:
    workflows: [docker-publish]
    types: [completed]
  push:
    branches: [main]
  pull_request:
    paths:
      - 'docs/docker-compose.yml'
      - 'Dockerfile'
      - 'web/Dockerfile'
      - '.github/workflows/docs-compose.yml'

permissions:
  contents: read
  packages: read

jobs:
  serves-a-site:
    # release and compose-touching PRs only. The push:main and workflow_run triggers
    # exist for the pin-reconcile job below, which is a cheap non-pulling check; this
    # job pulls two images and stands up a stack, so it must NOT run on every merge to
    # main, nor on every docker-publish completion. Named positively rather than as a
    # not-push exclusion: the negative form silently admitted workflow_run the moment
    # that trigger was added.
    if: github.event_name == 'release' || github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    env:
      COMPOSE: docker compose -f docs/docker-compose.yml
      # No YAADEGAR_IMAGE_TAG override (#275): let the compose use its own pinned
      # default, so CI pulls the exact tag the docs name (see the header note).
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Log in to GHCR
        uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Stand up the documented compose end to end
        run: |
          $COMPOSE pull
          # --wait blocks until the db and app health gates pass (web has no gate and
          # is only required to be running); a gate that never passes fails the job.
          $COMPOSE up -d --wait --wait-timeout 150

      - name: Assert the compose serves a site, not just healthy containers
        run: |
          # Seed a tenant so the web SSR has one to render for (the documented step).
          $COMPOSE exec -T app yaadegar create-tenant --subdomain alice

          # The site: the web service must render a real page for the tenant. Asserting
          # a 200 alone is not enough — an error page is also a 200-shaped body — so
          # grep the rendered HTML for a marker only a real page carries. curl -f also
          # fails the job on a non-2xx. Host: routes the tenant through the web edge.
          html="$(curl -fsS -H 'Host: alice.localhost' http://localhost:3000/login)"
          if ! printf '%s' "$html" | grep -qi 'yaadegar'; then
            echo "web served no recognisable page for the tenant (#258/#270): the compose starts but does not serve a site"
            printf '%s\n' "$html" | head -20
            exit 1
          fi
          echo "web renders a site for the tenant"

          # The public API door: web must proxy /api/v1/* through to the unpublished
          # app. This is the surface an images-only compose leaves dead when the web
          # image is missing (#258), so it is asserted, not assumed.
          curl -fsS -H 'Host: alice.localhost' http://localhost:3000/api/v1/auth/methods >/dev/null
          echo "web proxies the API through to app"

      # ORDERING-DEPENDENT — keep this step AFTER the site assert above. It infers a
      # closed port from a failed curl, which would ALSO pass with the whole stack
      # down; it is sound only because the site assert already proved the stack is up
      # and fails the job otherwise. Reordering this before that assert would make it
      # vacuous without looking any different.
      - name: Assert the backend port is not published
        run: |
          # ADR-0004 §7 / ADR-0014 §4: the app port must be reachable only on the
          # internal compose network. A stray ports: mapping that exposed 8080 would
          # silently break the forwarded-host trust model, so fail if it is reachable.
          if curl -fsS --max-time 5 http://localhost:8080/healthz >/dev/null 2>&1; then
            echo "the app backend answered on a published :8080 (#270): the backend port must stay unpublished"
            exit 1
          fi
          echo "backend port is not published"

      - name: Compose logs on failure
        if: failure()
        run: $COMPOSE logs --no-color --tail 100

      - name: Tear down
        if: always()
        run: $COMPOSE down -v

  # Keep the docs compose pin naming the current release WITHOUT a red on every release
  # (#278). The pin cannot be correct at release time — serves-a-site above pulls it, and a
  # pin bumped to the releasing version would name a tag docker-publish has not applied yet
  # (imagetools moves the pinnable tags last), so the pin trails one release until a small
  # bump PR lands. A hard failure on that guaranteed-stale state taught readers that red is
  # normal on release day, which is exactly how a genuinely stale pin would then hide.
  #
  # So this job RECONCILES rather than asserts, by event:
  #   - pull_request: a wrong pin is a HARD ERROR. This is the tooth worth keeping — it
  #     catches a typo (pinning 0.12.0) or a bump PR naming the wrong version, and makes the
  #     bump PR prove it set the pin to the current release.
  #   - release / push to main: the pin legitimately trails, so it does NOT fail. It keeps a
  #     single tracking issue in sync instead — opened/updated while the pin is stale, and
  #     CLOSED the moment the pin matches (a main push after the bump PR merges). One issue,
  #     reused by label, that closes itself: a stale pin stays visible and actionable
  #     without a red, and cannot decay into a permanent open issue that is just a quieter
  #     always-red.
  #
  # It reads no image, so it never races docker-publish. The pin still TRAILS, and it is
  # still a separate PR that moves it — the reason it is not auto-moved as part of the
  # release lives at the pin in docs/docker-compose.yml (#275). What changed (#307) is
  # only who opens that PR: this job does, instead of a person. The job id is unchanged
  # (pin-is-current) so any required-check-by-name keeps resolving.
  #
  # Auto-bumping the pin inside the RELEASE PR remains wrong and is not what this does.
  # That PR would name the version being cut, which is not published while it is open, so
  # serves-a-site would pull a tag that does not exist yet and this job's own pull_request
  # arm would hard-error on the release PR itself. The bump PR opened here is a separate
  # PR raised after docker-publish has SUCCEEDED for the release, which is the moment
  # the tag it names is known to exist (#319) — the release event alone is too early.
  pin-is-current:
    # docker-publish also runs on push:main, and workflow_run fires for those too.
    # Only a release publish can move the pin, so the rest are dropped here rather
    # than spending a runner to reach the same conclusion.
    if: github.event_name != 'workflow_run' || github.event.workflow_run.event == 'release'
    runs-on: ubuntu-latest
    # Scoped here rather than workflow-wide so serves-a-site does not inherit writes it
    # has no use for. contents+pull-requests push the bump branch and open its PR; issues
    # remains for the fallback below.
    permissions:
      contents: write
      issues: write
      pull-requests: write
    # Serialize reconcile runs. release:published and push:main fire ~10s apart for the
    # same release and BOTH run this job while the pin is stale (the normal post-release
    # window, and push:main has no path filter so it always runs). Without serialization
    # the list-then-create is a race: two runs each see no open issue and both open one —
    # a duplicate under the same label that the close path (which targets a single issue)
    # can leave permanently open, the quieter always-red this design exists to prevent. A
    # fixed group with cancel-in-progress:false queues them, so the second run sees the
    # first's issue and updates it instead of creating a second.
    concurrency:
      group: docs-pin-reconcile
      cancel-in-progress: false
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          # Same token expression as release-please.yml, for the same reason: a PR
          # opened with the built-in GITHUB_TOKEN does not fire pull_request, so its
          # checks never run. With RELEASE_PLEASE_TOKEN present the bump PR is authored
          # by that identity and gets CI like any other PR; without it the PR is still
          # opened and needs one close/reopen to start its checks. See RELEASING.md.
          token: ${{ secrets.RELEASE_PLEASE_TOKEN || secrets.GITHUB_TOKEN }}
          # A workflow_run event carries the triggering run's ref, which for a release
          # publish is the tag. The bump branch must come off main, so name it.
          ref: ${{ github.event_name == 'workflow_run' && 'main' || github.ref }}

      - name: Reconcile the docs compose pin against the current release
        env:
          # Consumers of each identity in this step, listed because the defect that
          # created this split was that nobody enumerated them — the comment explained
          # the one call it was written for and three others changed silently:
          #   GH_TOKEN    -> gh release list, gh pr list, gh pr create,
          #                  request-pr-reviewers.sh (its own gh api calls, #343)
          #   ISSUE_TOKEN -> gh label create, gh issue list, gh issue close (x2),
          #                  gh issue edit, gh issue create
          #
          # ⚠️ request-pr-reviewers.sh is a NEW consumer of GH_TOKEN and is listed
          # above rather than left to be discovered. It needs the PR identity, not
          # ISSUE_TOKEN: it reads and writes the reviewer set on the pull request
          # this step just opened, which is `pull-requests: write` on the job.
          #
          # Two identities, on purpose. GH_TOKEN is the PR identity: it may be a PAT,
          # because a PR opened with the built-in token does not fire pull_request and
          # its checks never run. ISSUE_TOKEN is always the built-in token, which is the
          # one this job's `issues: write` permission actually grants. A PAT is scoped by
          # whatever it was minted with and need not carry issue rights at all — pointing
          # the issue calls at it silently disabled every one of them (#317).
          GH_TOKEN: ${{ secrets.RELEASE_PLEASE_TOKEN || secrets.GITHUB_TOKEN }}
          ISSUE_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          # On a release this is the tag that just published; empty on push / PR /
          # workflow_run, where the isLatest lookup below resolves it instead.
          RELEASE_TAG: ${{ github.event.release.tag_name }}
          EVENT: ${{ github.event_name }}
          # Whether the bump PR may be opened on this run (#319). True only after
          # docker-publish has SUCCEEDED for a release — the one moment the tag the PR
          # would pin is known to exist. Every other path surfaces a stale pin through
          # the tracking issue instead, including a docker-publish that failed: the pin
          # is stale then too, and a PR naming an unpublished tag is what caused this.
          BUMP_OK: ${{ github.event_name == 'workflow_run' && github.event.workflow_run.conclusion == 'success' }}
          REPO: ${{ github.repository }}
          # Read by request-pr-reviewers.sh (#343). The bump PR is opened by the same
          # identity that opens the release PR, so it arrived with nobody requested
          # for the same reason and is fixed by the same script.
          #
          # 🚨 These are the identities that CAN approve this PR, and whoever opens it
          # is deliberately not among them — GitHub refuses a self-approval, so adding
          # the opening identity here for symmetry would create a request that can
          # never be satisfied: the same silence, wearing a reviewer badge.
          REVIEWERS: forge-rubigd sora-rubigd
        run: |
          set -euo pipefail

          # The version the docs SHOULD pin: the release that fired this event, or — on a
          # push or pull_request, which carry no release payload — the latest published
          # release. Select on isLatest, NOT the top of the list: gh release list includes
          # drafts and pre-releases, so a draft at the top would make the pin chase a tag
          # that does not exist. isLatest is GitHub's own latest-stable designation and is
          # never a draft or pre-release. Tags are yaadegar-vX.Y.Z; strip to bare semver.
          tag="$RELEASE_TAG"
          if [ -z "$tag" ]; then
            tag="$(gh release list --repo "$REPO" --limit 100 --json tagName,isLatest \
              --jq 'map(select(.isLatest)) | .[0].tagName // ""')"
          fi
          if [ -z "$tag" ]; then
            echo "no published release yet — nothing for the pin to be stale against; skipping"
            exit 0
          fi
          want="${tag#yaadegar-v}"

          # The pinned default(s): app and web both default the shared YAADEGAR_IMAGE_TAG,
          # so there must be exactly one distinct value across the pair — a mismatch is its
          # own bug (one image bumped, the other not).
          pins="$(grep -oE '\$\{YAADEGAR_IMAGE_TAG:-[^}]+\}' docs/docker-compose.yml \
            | sed -E 's/.*:-([^}]+)\}/\1/' | sort -u || true)"
          n="$(printf '%s' "$pins" | grep -c . || true)"
          if [ "$n" -ne 1 ]; then
            echo "expected exactly one \${YAADEGAR_IMAGE_TAG:-...} default in docs/docker-compose.yml, found: [$(printf '%s' "$pins" | tr '\n' ' ')] (#278) — the pin this job guards has moved, been renamed, or the pair diverged"
            exit 1
          fi
          got="$pins"

          # One reused tracking issue, found by a fixed label so exactly one is ever open.
          # Create the label idempotently first, so the --label filter never errors.
          LABEL="docs-pin-stale"
          GH_TOKEN="$ISSUE_TOKEN" gh label create "$LABEL" --repo "$REPO" --color ededed \
            --description "docs/docker-compose.yml pin trails the latest release" 2>/dev/null || true
          open_issue="$(GH_TOKEN="$ISSUE_TOKEN" gh issue list --repo "$REPO" --state open --label "$LABEL" --limit 1 \
            --json number --jq '.[0].number // ""')"

          if [ "$got" = "$want" ]; then
            echo "docs compose pin names the current release: $got"
            # Close the tracking issue only when the match is on main — a push or the
            # release event. A pull_request only PROPOSES the correct pin; closing on an
            # unmerged (or later abandoned) PR would clear the reminder for a change that
            # has not landed. The push:main after the bump PR merges does the close.
            if [ -n "$open_issue" ] && [ "$EVENT" != "pull_request" ]; then
              # The echo belongs INSIDE the success branch. Reporting the close after an
              # `||` warning printed "closed tracking issue" for a call that had just
              # failed, which is how a broken run read as a green one (#317).
              if GH_TOKEN="$ISSUE_TOKEN" gh issue close "$open_issue" --repo "$REPO" \
                   --comment "The docs compose pin now names $want; closing automatically."; then
                echo "closed tracking issue #$open_issue"
              else
                echo "::warning::could not close tracking issue #$open_issue (non-fatal)"
              fi
            fi
            exit 0
          fi

          # got != want: the pin is stale.
          if [ "$EVENT" = "pull_request" ]; then
            # HARD ERROR on a PR — a wrong pin must not merge. Catches a typo and makes a
            # bump PR prove it names the current release.
            echo "docs/docker-compose.yml pins :$got but the current release is $want (#278): set the \${YAADEGAR_IMAGE_TAG:-...} default to $want on both image lines"
            exit 1
          fi

          # The pin legitimately trails here. Open the PR that moves it (#307) rather
          # than asking a person to — the pin still trails and the bump is still its own
          # PR reviewed like any other; only the typing is gone.
          #
          # ONLY once docker-publish has succeeded for the release (#319). This block ran
          # on the release event itself, and asserted — in a comment AND in the PR body it
          # writes — that the tag it names is already published. That was false:
          # `release: published` fires while the images are still building, so the PR
          # pinned a tag that did not exist and serves-a-site failed on `manifest
          # unknown`. The claim is true now because the trigger makes it true, rather than
          # the claim having been edited to match what the code did.
          # Assigned before the guard below: the fallback warning names it, and under
          # `set -u` an unset variable there aborts the very path that exists to make a
          # stale pin visible when the bump could not happen.
          branch="docs-pin/$want"

          if [ "$BUMP_OK" = "true" ]; then

          existing_pr="$(gh pr list --repo "$REPO" --head "$branch" --state open \
            --json number --jq '.[0].number // ""')"
          if [ -n "$existing_pr" ]; then
            echo "bump PR #$existing_pr is already open for $want"
            # ⚠️ Still ensure the reviewers (#343), rather than exiting on the
            # strength of the PR existing. This path is what a RE-RUN takes, so it
            # is the only thing that can recover a reviewer request that failed on
            # the run that opened the PR — without it, the one case that needs a
            # retry is the one case that never gets one, and the PR sits with
            # nobody requested exactly as before.
            #
            # Safe to run repeatedly: the script reads the current requested set and
            # reviews first and asks only for who is missing from both, so it exits
            # without posting when there is nothing to do. That is the property it
            # was built with for release-please, which runs it on every rewrite.
            PR_NUMBER="$existing_pr" .github/scripts/request-pr-reviewers.sh
            exit 0
          fi

          # Rewrite every pinned default. The `g` flag and the shared variable name keep
          # the two image lines in step; a divergence between them is caught by the
          # exactly-one-distinct-value check above on the next run.
          sed -i -E "s|(\\\$\\{YAADEGAR_IMAGE_TAG:-)[^}]+(\\})|\\1$want\\2|g" docs/docker-compose.yml
          if git diff --quiet -- docs/docker-compose.yml; then
            echo "::warning::pin reported stale ($got vs $want) but rewriting changed nothing — the pin format may have moved"
            exit 0
          fi

          git config user.name "yaadegar-bot"
          git config user.email "yaadegar-bot@users.noreply.github.com"
          git checkout -b "$branch"
          git add docs/docker-compose.yml
          git commit -m "chore(docs): pin the compose quick start to $want" \
            -m "The self-hosting quick start named $got while the current release is $want." \
            -m "Opened automatically after the release (#307). The pin trails deliberately:" \
            -m "auto-bumping it inside the release PR would name a tag that is not published" \
            -m "while that PR is open (#275)."

          # A PR body a stranger can act on: what changed, why it trails, and what to check.
          pr_body="$(printf '%s\n' \
            "Moves the \`\${YAADEGAR_IMAGE_TAG:-...}\` default in \`docs/docker-compose.yml\` from **$got** to **$want** on both image lines, so the quick start names the release an operator would actually pull." \
            "" \
            "Opened automatically after the $want release." \
            "" \
            "**Why this is a separate PR rather than part of the release.** The pin trails on purpose. \`serves-a-site\` stands up this compose file using its own pinned default, with no override, so that CI pulls the exact artifact the docs name. A pin bumped to the version being released would name a tag that docker-publish has not applied yet, and the pull would race the publish. So the pin names the previous release until this PR lands, and this PR opens only after docker-publish has succeeded for $want, so the tag it names is published (#319)." \
            "" \
            "**What CI proves here:** \`serves-a-site\` runs on this PR because it touches the compose file, and it stands the stack up against the newly pinned tag. \`pin-is-current\` runs too, and on a pull_request a wrong pin is a hard error — so this PR has to prove it names the current release.")"

          if git push --quiet origin "$branch" \
            && gh pr create --repo "$REPO" --head "$branch" --base main \
                 --title "chore(docs): pin the compose quick start to $want" \
                 --body "$pr_body"; then
            echo "opened bump PR for $want"

            # Request the reviewers on the PR just opened (#343). The number is read
            # back from the API rather than parsed out of `gh pr create` output, using
            # the same query as the already-open check above — one way of answering
            # "which PR is this", not two.
            new_pr="$(gh pr list --repo "$REPO" --head "$branch" --state open \
              --json number --jq '.[0].number // ""')"
            PR_NUMBER="$new_pr" .github/scripts/request-pr-reviewers.sh

            # ⚠️ ORDERING-DEPENDENT — this runs BEFORE the tracking issue is closed,
            # and the order is the point. `set -e` is on, so a failed reviewer request
            # aborts here and leaves the tracking issue OPEN: the stale pin stays
            # visible on the surface built for it, in addition to the red run. Closing
            # first would retire that reminder while calling the PR "superseded" by a
            # PR that notifies nobody, which is the quieter always-red this job's whole
            # design exists to avoid.
            #
            # The PR itself survives a failure here, which is correct — it is open and
            # correct, it is only unannounced, and the red says so.

            # The PR supersedes the reminder; a leftover issue from before this job
            # opened PRs would otherwise sit open forever with no one to close it.
            if [ -n "$open_issue" ]; then
              GH_TOKEN="$ISSUE_TOKEN" gh issue close "$open_issue" --repo "$REPO" \
                --comment "Superseded by the bump PR for $want, which is opened automatically now." \
                || echo "::warning::could not close superseded tracking issue #$open_issue (non-fatal)"
            fi
            exit 0
          fi

          else
            echo "pin is stale ($got vs $want), but this event ($EVENT) cannot confirm the images for $want are published — surfacing the tracking issue rather than opening a PR that would race the publish (#319)"
          fi

          # Fallback: reached when the bump PR could not be opened, or when this event
          # could not safely open one (#319). Either way a stale pin must still be visible
          # and actionable rather than only a line in a log nobody reads (#278). Warn,
          # and keep the tracking issue as the surface it always was.
          if [ "$BUMP_OK" = "true" ]; then
            # The push or the create actually failed. Name the likely cause: the
            # short-circuit above only looks for an OPEN PR, so a bump PR closed unmerged
            # leaves its branch behind and the push here is rejected as non-fast-forward.
            # That is not a token or permission fault, and saying so keeps the next
            # investigation off the wrong trail.
            echo "::warning::could not open the bump PR for $want — falling back to the tracking issue. If branch $branch still exists from a closed bump PR, delete it and re-run; this is not necessarily a token problem."
          else
            # Not a failure: this event simply cannot confirm the images exist, so the
            # issue is the correct surface until the one that can comes along (#319).
            echo "the pin is stale and the bump PR is not opened on this event — tracking issue is the surface until docker-publish succeeds for $want"
          fi
          title="Bump docs compose pin to $want"
          body="$(printf '%s\n' \
            "The self-hosting quick start (\`docs/docker-compose.yml\`) pins an older release." \
            "" \
            "Bump the \`\${YAADEGAR_IMAGE_TAG:-...}\` default from **$got** to **$want** on both image lines, so the docs name the release an operator would actually pull." \
            "" \
            "This is normally opened as a PR automatically (#307); that failed on this run, so it is here instead. The pin trails deliberately — auto-bumping it inside the release PR would race docker-publish, see the pin comment in the file and #275. This issue closes itself once the pin matches (#278).")"
          if [ -n "$open_issue" ]; then
            if GH_TOKEN="$ISSUE_TOKEN" gh issue edit "$open_issue" --repo "$REPO" \
                 --title "$title" --body "$body"; then
              echo "updated tracking issue #$open_issue -> $want"
            else
              echo "::warning::could not update tracking issue #$open_issue (non-fatal)"
            fi
          else
            if GH_TOKEN="$ISSUE_TOKEN" gh issue create --repo "$REPO" \
                 --title "$title" --body "$body" --label "$LABEL"; then
              echo "opened tracking issue for $want"
            else
              echo "::warning::could not open tracking issue (non-fatal)"
            fi
          fi
