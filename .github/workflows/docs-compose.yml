# Prove the documented self-hosting compose actually serves a site (#270,
# ADR-0014 §4). A quick-start compose is copy-pasted rather than read, so it has to
# be RUN, not reviewed — and asserting that containers merely start is exactly the
# signal that cannot tell #258 (a healthy API serving no website) apart from a
# working instance. So this stands up docs/docker-compose.yml end to end and asserts
# the web service renders a real page and proxies the API.
#
# Cost, accepted with eyes open (ADR-0014 §4): this pulls two images, waits on
# Postgres and the app health gate, and asserts on a rendered response, so it is the
# slowest and least deterministic job here. It runs only on a release and on changes
# to the compose or either Dockerfile — not on every push — and a flake here gets
# FIXED, not retried away: a quick start that passes only on a re-run is not one an
# operator can trust.
#
# Tag note (#275): the 0.13.0 release publishes BOTH images, so this now runs the
# compose exactly as the docs hand it to a self-hoster — against the pinned version
# tag its default names (currently :0.13.0), not a rolling :main stand-in. CI thus
# proves the specific artifact an operator would pull. The pinned default trails the
# most-recent release until bumped, so on a release event it resolves to an
# already-published tag rather than the one that release is still publishing.
#
# Staleness guard (#278): serves-a-site keeps the pin TRAILING (above), so nothing here
# forces it forward — a release could leave the docs naming the previous version with
# this job still green on it forever, and an operator copying the file would get a stale
# pair. The pin-is-current job below closes that WITHOUT disturbing the trailing pin: it
# pulls no image, so it cannot race docker-publish the way a fresh pin would, and it
# fails on the release event the instant the pinned default no longer names the current
# release. Auto-bumping the pin instead would make the pulling job race the publish it
# depends on (the fresh tag is applied late by imagetools), so the split is deliberate:
# a trailing pin for the job that pulls, a non-pulling assert for currency. Consequence,
# and it is expected: pin-is-current goes red on every release until a follow-up bump PR
# updates the pin — that red is the signal to open the bump PR, not a check to silence
# (see the job's own note before touching it).

name: docs-compose

on:
  release:
    types: [published]
  pull_request:
    paths:
      - 'docs/docker-compose.yml'
      - 'Dockerfile'
      - 'web/Dockerfile'
      - '.github/workflows/docs-compose.yml'

permissions:
  contents: read
  packages: read

jobs:
  serves-a-site:
    runs-on: ubuntu-latest
    env:
      COMPOSE: docker compose -f docs/docker-compose.yml
      # No YAADEGAR_IMAGE_TAG override (#275): let the compose use its own pinned
      # default, so CI pulls the exact tag the docs name (see the header note).
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Log in to GHCR
        uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Stand up the documented compose end to end
        run: |
          $COMPOSE pull
          # --wait blocks until the db and app health gates pass (web has no gate and
          # is only required to be running); a gate that never passes fails the job.
          $COMPOSE up -d --wait --wait-timeout 150

      - name: Assert the compose serves a site, not just healthy containers
        run: |
          # Seed a tenant so the web SSR has one to render for (the documented step).
          $COMPOSE exec -T app yaadegar create-tenant --subdomain alice

          # The site: the web service must render a real page for the tenant. Asserting
          # a 200 alone is not enough — an error page is also a 200-shaped body — so
          # grep the rendered HTML for a marker only a real page carries. curl -f also
          # fails the job on a non-2xx. Host: routes the tenant through the web edge.
          html="$(curl -fsS -H 'Host: alice.localhost' http://localhost:3000/login)"
          if ! printf '%s' "$html" | grep -qi 'yaadegar'; then
            echo "web served no recognisable page for the tenant (#258/#270): the compose starts but does not serve a site"
            printf '%s\n' "$html" | head -20
            exit 1
          fi
          echo "web renders a site for the tenant"

          # The public API door: web must proxy /api/v1/* through to the unpublished
          # app. This is the surface an images-only compose leaves dead when the web
          # image is missing (#258), so it is asserted, not assumed.
          curl -fsS -H 'Host: alice.localhost' http://localhost:3000/api/v1/auth/methods >/dev/null
          echo "web proxies the API through to app"

      # ORDERING-DEPENDENT — keep this step AFTER the site assert above. It infers a
      # closed port from a failed curl, which would ALSO pass with the whole stack
      # down; it is sound only because the site assert already proved the stack is up
      # and fails the job otherwise. Reordering this before that assert would make it
      # vacuous without looking any different.
      - name: Assert the backend port is not published
        run: |
          # ADR-0004 §7 / ADR-0014 §4: the app port must be reachable only on the
          # internal compose network. A stray ports: mapping that exposed 8080 would
          # silently break the forwarded-host trust model, so fail if it is reachable.
          if curl -fsS --max-time 5 http://localhost:8080/healthz >/dev/null 2>&1; then
            echo "the app backend answered on a published :8080 (#270): the backend port must stay unpublished"
            exit 1
          fi
          echo "backend port is not published"

      - name: Compose logs on failure
        if: failure()
        run: $COMPOSE logs --no-color --tail 100

      - name: Tear down
        if: always()
        run: $COMPOSE down -v

  # Non-pulling companion to serves-a-site (#278). serves-a-site deliberately keeps the
  # compose pin TRAILING (see the header note and #275) so it only ever pulls an already
  # published tag and never races docker-publish. The price of that safety is that
  # nothing drives the pin forward: after a release, docs/docker-compose.yml goes on
  # naming the PREVIOUS version and serves-a-site stays green on it, so an operator
  # copying the file gets a stale pair while CI looks happy.
  #
  # This job closes that gap without reintroducing the race. It reads no image — it only
  # compares the pinned default in the compose file against the release that should be
  # named — so it is immune to the publish-ordering race that keeps serves-a-site on the
  # trailing pin. It runs on release: published, the exact moment the pin goes stale, so
  # a release that forgets to bump the docs pin fails loudly on the spot rather than
  # waiting for someone to happen to edit one of the four path-filtered files; and on
  # pull_request, so the bump PR that fixes it can go green.
  #
  # EXPECTED, not a flake: this job goes RED on every release event and stays red until a
  # follow-up PR bumps docs/docker-compose.yml's pin to the just-released version — the
  # pin must trail for the job that pulls (serves-a-site) yet be current for this one, so
  # the two are in tension for exactly one bump cycle per release. That red IS the signal
  # to open the bump PR; it is not a spurious failure. Do not silence it by deleting the
  # job or loosening the assert — the bump PR is the intended and only correct response.
  pin-is-current:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Assert the docs compose pin names the current release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          # On a release event this is the tag that just published; empty on a PR.
          RELEASE_TAG: ${{ github.event.release.tag_name }}
        run: |
          set -euo pipefail
          # The tag the docs SHOULD pin: the release that fired this event, or — on a
          # pull_request, which carries no release payload — the latest published release.
          # Select on isLatest, NOT the top of the list: gh release list includes drafts
          # and pre-releases by default, so a draft sitting at the top would become the
          # wanted version and the assert would demand the pin name a tag that does not
          # exist — a contributor following the message would then pin a phantom tag and
          # break the pulling job on the next release. isLatest is GitHub's own
          # latest-stable designation and is never a draft or pre-release. Release tags
          # are yaadegar-vX.Y.Z; strip the prefix to the bare semver the compose carries.
          tag="$RELEASE_TAG"
          if [ -z "$tag" ]; then
            tag="$(gh release list --limit 100 --json tagName,isLatest --jq 'map(select(.isLatest)) | .[0].tagName // ""')"
          fi
          if [ -z "$tag" ]; then
            echo "no published release yet — nothing for the pin to be stale against; skipping"
            exit 0
          fi
          want="${tag#yaadegar-v}"

          # The pinned default(s) baked into the compose. app and web both default the
          # shared YAADEGAR_IMAGE_TAG, so there must be exactly one distinct value across
          # the pair — a mismatch is its own bug (one image bumped, the other not).
          pins="$(grep -oE '\$\{YAADEGAR_IMAGE_TAG:-[^}]+\}' docs/docker-compose.yml \
            | sed -E 's/.*:-([^}]+)\}/\1/' | sort -u || true)"
          n="$(printf '%s' "$pins" | grep -c . || true)"
          if [ "$n" -eq 0 ]; then
            echo "found no \${YAADEGAR_IMAGE_TAG:-...} default in docs/docker-compose.yml (#278): the pin this job guards has moved or been renamed"
            exit 1
          fi
          if [ "$n" -ne 1 ]; then
            echo "the app and web images pin different defaults ($(printf '%s' "$pins" | tr '\n' ' ')) (#278): the pair must move together"
            exit 1
          fi
          got="$pins"

          if [ "$got" != "$want" ]; then
            echo "docs/docker-compose.yml pins :$got but the current release is $want (#278): bump the pinned default so the docs name the release an operator would actually pull"
            exit 1
          fi
          echo "docs compose pin names the current release: $got"
