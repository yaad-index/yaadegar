# Frontend CI (web/): typecheck, lint, build, and verify the generated OpenAPI
# client still mirrors api/openapi.yaml (the same drift-guard the backend uses for
# its generated server). Runs on changes to the app or the spec.

name: web

on:
  pull_request:
    branches: [main]
    paths:
      - 'web/**'
      - 'api/openapi.yaml'
      - '.github/workflows/web.yml'

permissions:
  contents: read

defaults:
  run:
    working-directory: web

jobs:
  web:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Node
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: web/package-lock.json

      - name: Install
        run: npm ci

      - name: Verify the generated API client matches the spec
        run: npm run verify:api

      - name: Typecheck
        run: npm run check

      - name: Lint
        run: npm run lint

      - name: Build
        run: npm run build
