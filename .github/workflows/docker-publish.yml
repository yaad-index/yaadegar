# Build and publish the container images to GHCR (#57, #268).
#
# Two images, released as a matched pair (ADR-0014): the API (`yaadegar`, from the
# repo root — the CGO-free static Go binary on distroless) and the web frontend
# (`yaadegar-web`, from `web/` — adapter-node on a slim Node base). Both are derived
# from ONE metadata step and one resolved version, so `:0.13.0` denotes the same
# release on both and they cannot drift apart at the tag level.
#
# On a published release, push the versioned tags + `latest` (release-please cuts
# the releases). On a push to main, push a rolling `main` tag + a short-sha tag for
# bleeding-edge testing. Images are multi-arch (amd64 + arm64).
#
# Neither image is pushed until BOTH have had their version stamp built and read
# back (release only) — a half-published release that moves `:latest` on one image
# and not the other is exactly the mismatched pair ADR-0014 exists to prevent, so
# the verify-both-then-push-both ordering is the requirement, not an optimisation.
#
# The publish itself moves the pinnable tags on both images or neither (#272): both
# are pushed by digest first (layers up, no human-readable tag moved), then the
# pinnable tags are applied to each digest last, back to back — a manifest write, no
# build or upload between them. A failure before both digests are up leaves every
# pinnable tag on the previous release. See the push-phase comment for the details.
#
# Auth is the built-in GITHUB_TOKEN against ghcr.io — no PAT or extra secret.

name: docker-publish

on:
  release:
    types: [published]
  push:
    branches: [main]

permissions:
  contents: read
  packages: write

env:
  IMAGE: ghcr.io/yaad-index/yaadegar
  WEB_IMAGE: ghcr.io/yaad-index/yaadegar-web

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Log in to GHCR
        uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Derive tags and labels
        id: meta
        uses: docker/metadata-action@dc802804100637a589fabce1cb79ff13a1411302 # v6.2.0
        with:
          # BOTH images from one step, so a single version resolution fans out to an
          # identical tag set on each — the matched pair is established here, not by
          # two steps that could diverge. steps.meta.outputs.version is the single
          # resolved version, image-independent.
          images: |
            ${{ env.IMAGE }}
            ${{ env.WEB_IMAGE }}
          # Versioned + major.minor + latest on release; a rolling branch tag on
          # main; a short-sha tag always (bleeding-edge / traceability).
          #
          # release-please cuts a component-prefixed git tag (yaadegar-v0.4.0), which
          # type=semver cannot parse — so releases published only :latest, with no
          # pinnable version. type=match strips the yaadegar-v prefix off the tag ref
          # to emit :X.Y.Z and :X.Y. These match only when the ref is such a tag
          # (i.e. on a release), never on a branch push.
          tags: |
            type=match,pattern=yaadegar-v(.*),group=1
            type=match,pattern=yaadegar-v(\d+\.\d+),group=1
            type=raw,value=latest,enable=${{ github.event_name == 'release' }}
            type=ref,event=branch
            type=sha
          labels: |
            org.opencontainers.image.title=Yaadegar
            org.opencontainers.image.description=API-first, self-hosted gift registry and wishlist.
            org.opencontainers.image.source=https://github.com/yaad-index/yaadegar
            org.opencontainers.image.licenses=MIT

      - name: Split the shared tag set per image
        id: tags
        # metadata-action emits every tag for both images, interleaved. Partition it
        # back into one list per image so each build-push step tags only its own
        # image — building the API context but tagging it `yaadegar-web` would be the
        # mismatch we are preventing. The colon after the repo name disambiguates
        # `yaadegar:` from `yaadegar-web:`.
        env:
          ALL_TAGS: ${{ steps.meta.outputs.tags }}
        run: |
          api="$(printf '%s\n' "$ALL_TAGS" | grep "^${IMAGE}:" || true)"
          web="$(printf '%s\n' "$ALL_TAGS" | grep "^${WEB_IMAGE}:" || true)"
          if [ -z "$api" ] || [ -z "$web" ]; then
            echo "tag split produced an empty list for one image (#268): api=[$api] web=[$web] — the matched pair cannot be published half-tagged"
            exit 1
          fi
          {
            echo "api<<TAGS_EOF"; printf '%s\n' "$api"; echo "TAGS_EOF"
            echo "web<<TAGS_EOF"; printf '%s\n' "$web"; echo "TAGS_EOF"
          } >> "$GITHUB_OUTPUT"

      - name: Set up QEMU
        uses: docker/setup-qemu-action@96fe6ef7f33517b61c61be40b68a1882f3264fb8 # v4.2.0

      - name: Set up Buildx
        uses: docker/setup-buildx-action@bb05f3f5519dd87d3ba754cc423b652a5edd6d2c # v4.2.0

      # Gate the release on the resolved version BEFORE building or pushing (#190).
      # steps.meta.outputs.version is fully resolved by the metadata step, so a
      # tag-config change that resolves it to something useless (a bare sha, an
      # empty string) fails here instead of publishing a mislabelled image and
      # moving `latest` onto it — detection-after-shipping is the exact shape of
      # the bug this fixes. Release only: a main push legitimately resolves to
      # "main". Shape, never equality to the git tag — yaadegar-v0.4.0 correctly
      # resolves to 0.4.0, so an equality check would fail a good build.
      - name: Assert the resolved release version is semver-shaped
        if: github.event_name == 'release'
        env:
          RESOLVED_VERSION: ${{ steps.meta.outputs.version }}
        run: |
          # Anchored both ends; the optional suffix is a semver prerelease (-) or
          # build (+) tail (0.4.0-rc1, 0.4.0+build.5). A leading dot is not a valid
          # semver suffix, so this rejects a fourth numeric component (0.4.0.1) and
          # any trailing garbage.
          if ! printf '%s\n' "$RESOLVED_VERSION" | grep -Eq '^[0-9]+\.[0-9]+\.[0-9]+([-+][0-9A-Za-z.-]+)?$'; then
            echo "resolved release version '$RESOLVED_VERSION' is not semver-shaped (#190): refusing to build and publish a mislabelled image"
            exit 1
          fi
          echo "resolved release version is semver-shaped: $RESOLVED_VERSION"

      # --- Verify phase (release only): both images' stamps round-trip BEFORE any
      # push. Each builds single-arch, loads, and reads the stamp back out of the
      # loaded image; either failure exits the job before the push steps below run,
      # so a dropped build-arg or broken stamp on EITHER image blocks BOTH pushes.
      # This is what makes "neither pushed until both verify" true (#268). Native
      # amd64 + load only (no QEMU, no push); the layers feed the gha cache the
      # multi-arch pushes reuse, so the extra cost is one amd64 build per image on
      # releases only. Neither observes whether the push steps still forward VERSION
      # — that is the publish-forwards-version job in ci.yml, which reads this file.

      - name: Build the API image single-arch and verify its version stamp
        if: github.event_name == 'release'
        uses: docker/build-push-action@53b7df96c91f9c12dcc8a07bcb9ccacbed38856a # v7.3.0
        with:
          context: .
          platforms: linux/amd64
          load: true
          build-args: |
            VERSION=${{ steps.meta.outputs.version }}
          tags: ${{ env.IMAGE }}:verify-stamp
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Assert the pre-publish API image reports the resolved version
        if: github.event_name == 'release'
        env:
          IMAGE_REF: ${{ env.IMAGE }}:verify-stamp
          RESOLVED_VERSION: ${{ steps.meta.outputs.version }}
        run: |
          # Equality, not shape (#276): a well-formed stamp can still be the WRONG
          # version — an image tagged 0.13.0 that reports 0.9.9 is semver-shaped and
          # is exactly the mislabelling this pipeline exists to catch. The stamp must
          # equal the version the image will be tagged with. (The resolved value was
          # already shape-checked above; that gate asks the different question of
          # whether tag resolution produced something usable at all.)
          got="$(docker run --rm "$IMAGE_REF" version)"
          if [ "$got" != "$RESOLVED_VERSION" ]; then
            echo "pre-publish API image reports '$got', not the resolved release version '$RESOLVED_VERSION' (#276/#193): VERSION was not forwarded correctly into the build — refusing to push a mislabelled image"
            exit 1
          fi
          echo "pre-publish API image reports the resolved version: $got"

      - name: Build the web image single-arch and verify its version stamp
        if: github.event_name == 'release'
        uses: docker/build-push-action@53b7df96c91f9c12dcc8a07bcb9ccacbed38856a # v7.3.0
        with:
          context: ./web
          platforms: linux/amd64
          load: true
          build-args: |
            VERSION=${{ steps.meta.outputs.version }}
          tags: ${{ env.WEB_IMAGE }}:verify-stamp
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Assert the pre-publish web image reports the resolved version
        if: github.event_name == 'release'
        env:
          IMAGE_REF: ${{ env.WEB_IMAGE }}:verify-stamp
          RESOLVED_VERSION: ${{ steps.meta.outputs.version }}
        run: |
          # The web image is a server, not a CLI: read the baked stamp the way the
          # running server does, off process.env, by overriding the CMD with node.
          # Equality, not shape (#276): the web stamp must equal the resolved version
          # so a matched pair carries the SAME correct version on both images, not
          # merely two independently well-formed ones.
          got="$(docker run --rm "$IMAGE_REF" node -e 'process.stdout.write(process.env.YAADEGAR_VERSION || "")')"
          if [ "$got" != "$RESOLVED_VERSION" ]; then
            echo "pre-publish web image reports '$got', not the resolved release version '$RESOLVED_VERSION' (#276/#268): VERSION was not forwarded correctly into the web build — refusing to push a mismatched pair"
            exit 1
          fi
          echo "pre-publish web image reports the resolved version: $got"

      # --- Push phase (#272): both images verified above, now build multi-arch and
      # publish them so the pinnable tags (:latest, :X.Y.Z) move on BOTH or NEITHER.
      #
      # The two images live in separate GHCR repositories, so a registry has no
      # cross-repo transaction — a truly atomic pair-publish is not on offer. What IS
      # on offer, and what a naive two-step `push: true` gave up, is keeping the
      # *pinnable tag move* last and cheap: previously a transient failure of the web
      # push AFTER the API push had already moved :latest/:X.Y.Z left a half-published
      # pair (API advanced, web did not). So instead:
      #
      #   1. Push BOTH images by digest (push-by-digest=true). This uploads every
      #      layer + a content-addressed manifest but moves NO human-readable tag —
      #      nothing an operator pulls by :latest or :X.Y.Z changes yet. If the web
      #      digest push fails after the API one, the API repo has only unreferenced
      #      blobs (garbage-collected), and every pinnable tag still points at the
      #      previous release. Both-or-neither holds at the layer where it matters.
      #   2. Apply the pinnable tags to each pushed digest LAST, back to back. The
      #      layers are already in GHCR, so each is a near-instant manifest write with
      #      no build and no upload. That two-manifest-write window is the single
      #      irreducible residual (no cross-repo transaction), down from a full
      #      multi-arch build+push between the two tag moves.

      - name: Build and push the API image by digest
        id: build_api
        uses: docker/build-push-action@53b7df96c91f9c12dcc8a07bcb9ccacbed38856a # v7.3.0
        with:
          context: .
          platforms: linux/amd64,linux/arm64
          # push-by-digest: upload layers + a digest-addressed manifest, apply no tag
          # (the pinnable tags are applied together in the tag-move step below, #272).
          outputs: type=image,name=${{ env.IMAGE }},push-by-digest=true,name-canonical=true,push=true
          # Stamp the resolved version into the binary at link time (#190) so the
          # image reports its build via the `version` subcommand and startup log
          # instead of "dev". On a release this is the version derived from the tag
          # (e.g. 0.4.0 from yaadegar-v0.4.0, prefix stripped by the metadata step);
          # on a main push it is "main". The Dockerfile defaults it to "dev".
          build-args: |
            VERSION=${{ steps.meta.outputs.version }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Build and push the web image by digest
        id: build_web
        uses: docker/build-push-action@53b7df96c91f9c12dcc8a07bcb9ccacbed38856a # v7.3.0
        with:
          context: ./web
          platforms: linux/amd64,linux/arm64
          outputs: type=image,name=${{ env.WEB_IMAGE }},push-by-digest=true,name-canonical=true,push=true
          # Same resolved version as the API push above (#268): the web image bakes
          # it into YAADEGAR_VERSION as the value the server reports, so a matched
          # pair carries one version on both. Defaults to "dev" for a source build.
          build-args: |
            VERSION=${{ steps.meta.outputs.version }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      # Tag move — the last and cheapest operation (#272). Both digests are already
      # in GHCR from the steps above, so applying the pinnable tags is a manifest
      # write per image with no build and no layer upload. Ordered API-then-web with
      # nothing between them, so the both-or-neither window is these two writes.
      - name: Apply the pinnable tags to the pushed API digest
        env:
          TAGS: ${{ steps.tags.outputs.api }}
          DIGEST: ${{ steps.build_api.outputs.digest }}
        run: |
          args=()
          while IFS= read -r t; do
            [ -n "$t" ] && args+=(--tag "$t")
          done <<< "$TAGS"
          docker buildx imagetools create "${args[@]}" "${IMAGE}@${DIGEST}"

      - name: Apply the pinnable tags to the pushed web digest
        env:
          TAGS: ${{ steps.tags.outputs.web }}
          DIGEST: ${{ steps.build_web.outputs.digest }}
        run: |
          args=()
          while IFS= read -r t; do
            [ -n "$t" ] && args+=(--tag "$t")
          done <<< "$TAGS"
          docker buildx imagetools create "${args[@]}" "${WEB_IMAGE}@${DIGEST}"

      # End-to-end confirmation, after the tags are applied: pull each pinnable tag
      # and assert the image it now resolves to reports EXACTLY the resolved release
      # version (#276). Shape is not the question worth asking here — an image tagged
      # :0.13.0 that reports 0.9.9 is semver-shaped and is precisely the mislabelled
      # release this must catch. The pre-build gate already blocked an unusable
      # resolved *value*; these confirm the pinnable tag an operator pulls resolves to
      # an image stamped with that same value, end to end. Release only.
      - name: Assert the released API image reports the resolved version
        if: github.event_name == 'release'
        env:
          IMAGE_REF: ${{ env.IMAGE }}:${{ steps.meta.outputs.version }}
          RESOLVED_VERSION: ${{ steps.meta.outputs.version }}
        run: |
          got="$(docker run --rm "$IMAGE_REF" version)"
          if [ "$got" != "$RESOLVED_VERSION" ]; then
            echo "released API image ($IMAGE_REF) reports '$got', not '$RESOLVED_VERSION' (#276/#190): the pinnable tag resolves to a mislabelled image"
            exit 1
          fi
          echo "released API image reports the resolved version: $got"

      - name: Assert the released web image reports the resolved version
        if: github.event_name == 'release'
        env:
          IMAGE_REF: ${{ env.WEB_IMAGE }}:${{ steps.meta.outputs.version }}
          RESOLVED_VERSION: ${{ steps.meta.outputs.version }}
        run: |
          got="$(docker run --rm "$IMAGE_REF" node -e 'process.stdout.write(process.env.YAADEGAR_VERSION || "")')"
          if [ "$got" != "$RESOLVED_VERSION" ]; then
            echo "released web image ($IMAGE_REF) reports '$got', not '$RESOLVED_VERSION' (#276/#268): the resolved publish version did not carry into the web image"
            exit 1
          fi
          echo "released web image reports the resolved version: $got"
