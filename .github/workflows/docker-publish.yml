# Build and publish the container image to GHCR (#57).
#
# On a published release, push the versioned tags + `latest` (release-please cuts
# the releases). On a push to main, push a rolling `main` tag + a short-sha tag for
# bleeding-edge testing. Images are multi-arch (amd64 + arm64); the binary is
# CGO-free static so it cross-builds cleanly under buildx.
#
# Auth is the built-in GITHUB_TOKEN against ghcr.io — no PAT or extra secret.

name: docker-publish

on:
  release:
    types: [published]
  push:
    branches: [main]

permissions:
  contents: read
  packages: write

env:
  IMAGE: ghcr.io/yaad-index/yaadegar

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Log in to GHCR
        uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Derive tags and labels
        id: meta
        uses: docker/metadata-action@dc802804100637a589fabce1cb79ff13a1411302 # v6.2.0
        with:
          images: ${{ env.IMAGE }}
          # Versioned + major.minor + latest on release; a rolling branch tag on
          # main; a short-sha tag always (bleeding-edge / traceability).
          #
          # release-please cuts a component-prefixed git tag (yaadegar-v0.4.0), which
          # type=semver cannot parse — so releases published only :latest, with no
          # pinnable version. type=match strips the yaadegar-v prefix off the tag ref
          # to emit :X.Y.Z and :X.Y. These match only when the ref is such a tag
          # (i.e. on a release), never on a branch push.
          tags: |
            type=match,pattern=yaadegar-v(.*),group=1
            type=match,pattern=yaadegar-v(\d+\.\d+),group=1
            type=raw,value=latest,enable=${{ github.event_name == 'release' }}
            type=ref,event=branch
            type=sha
          labels: |
            org.opencontainers.image.title=Yaadegar
            org.opencontainers.image.description=API-first, self-hosted gift registry and wishlist.
            org.opencontainers.image.source=https://github.com/yaad-index/yaadegar
            org.opencontainers.image.licenses=MIT

      - name: Set up QEMU
        uses: docker/setup-qemu-action@96fe6ef7f33517b61c61be40b68a1882f3264fb8 # v4.2.0

      - name: Set up Buildx
        uses: docker/setup-buildx-action@bb05f3f5519dd87d3ba754cc423b652a5edd6d2c # v4.2.0

      # Gate the release on the resolved version BEFORE building or pushing (#190).
      # steps.meta.outputs.version is fully resolved by the metadata step, so a
      # tag-config change that resolves it to something useless (a bare sha, an
      # empty string) fails here instead of publishing a mislabelled image and
      # moving `latest` onto it — detection-after-shipping is the exact shape of
      # the bug this fixes. Release only: a main push legitimately resolves to
      # "main". Shape, never equality to the git tag — yaadegar-v0.4.0 correctly
      # resolves to 0.4.0, so an equality check would fail a good build.
      - name: Assert the resolved release version is semver-shaped
        if: github.event_name == 'release'
        env:
          RESOLVED_VERSION: ${{ steps.meta.outputs.version }}
        run: |
          if ! printf '%s\n' "$RESOLVED_VERSION" | grep -Eq '^[0-9]+\.[0-9]+\.[0-9]+'; then
            echo "resolved release version '$RESOLVED_VERSION' is not semver-shaped (#190): refusing to build and publish a mislabelled image"
            exit 1
          fi
          echo "resolved release version is semver-shaped: $RESOLVED_VERSION"

      - name: Build and push
        uses: docker/build-push-action@53b7df96c91f9c12dcc8a07bcb9ccacbed38856a # v7.3.0
        with:
          context: .
          platforms: linux/amd64,linux/arm64
          push: true
          # Stamp the resolved version into the binary at link time (#190) so the
          # image reports its build via the `version` subcommand and startup log
          # instead of "dev". On a release this is the version derived from the tag
          # (e.g. 0.4.0 from yaadegar-v0.4.0, prefix stripped by the metadata step);
          # on a main push it is "main". The Dockerfile defaults it to "dev".
          build-args: |
            VERSION=${{ steps.meta.outputs.version }}
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      # End-to-end confirmation, after push: read the version back out of the
      # published image and assert it is semver-shaped (#190). The pre-build gate
      # above already blocked a bad *resolved value* before publishing; this asks
      # the different question of whether the stamp carried that value through the
      # link flags into the shipped binary end to end. Release only, and shape
      # rather than equality to the tag, for the same reasons as the gate above.
      - name: Assert the released image reports a semver version
        if: github.event_name == 'release'
        run: |
          got="$(docker run --rm ${{ env.IMAGE }}:${{ steps.meta.outputs.version }} version)"
          if ! printf '%s\n' "$got" | grep -Eq '^[0-9]+\.[0-9]+\.[0-9]+'; then
            echo "released image reports '$got', which is not a semver version (#190): the resolved publish version is wrong"
            exit 1
          fi
          echo "released image reports semver version: $got"
