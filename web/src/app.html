<!doctype html>
<html lang="en">
	<head>
		<meta charset="utf-8" />
		<meta name="viewport" content="width=device-width, initial-scale=1" />
		<meta name="text-scale" content="scale" />
		<!--
			Preload the two latin faces used above the fold on every page (the
			Fraunces wordmark and Inter body). crossorigin is required even
			same-origin: font fetches are CORS-anonymous, and the preload must
			match or it double-fetches (#218).
		-->
		<link
			rel="preload"
			href="/fonts/fraunces-latin.woff2"
			as="font"
			type="font/woff2"
			crossorigin
		/>
		<link rel="preload" href="/fonts/inter-latin.woff2" as="font" type="font/woff2" crossorigin />
		%sveltekit.head%
	</head>
	<body data-sveltekit-preload-data="hover">
		<div style="display: contents">%sveltekit.body%</div>
	</body>
</html>
